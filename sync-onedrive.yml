name: Sincronizar base do OneDrive

on:
  schedule:
    # A cada hora, em ponto. Ajuste o cron conforme a frequência que fizer sentido
    # (ex: '0 8,12,18 * * 1-5' para rodar só às 8h, 12h e 18h, de segunda a sexta).
    - cron: "0 * * * *"
  workflow_dispatch: {} # permite clicar em "Run workflow" manualmente na aba Actions

permissions:
  contents: write # necessário para o robô poder comitar o arquivo atualizado

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código do repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar dependências
        run: pip install requests

      - name: Baixar base do OneDrive
        env:
          ONEDRIVE_URL: ${{ secrets.ONEDRIVE_URL }}
        run: python sync_onedrive.py

      - name: Comitar e enviar, se o arquivo mudou
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Atualização automática da base (sync OneDrive)"
          file_pattern: data/dados.xlsx
