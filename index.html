/* =========================================================
   3. UTILS
   ========================================================= */
function normalize(s){
  return (s===null||s===undefined) ? '' : s.toString().trim().toUpperCase().replace(/\s+/g,' ');
}

// Verifica se o centro de custo do registro está entre os selecionados no filtro
function centroCustoAllowed(r){
  return state.selectedCentrosCusto.has(normalize(r.centroCusto));
}

// Jovem Aprendiz não faz parte da meta de quadro: não conta como ativo (card, tabela, gráficos, Gerar Base)
function isAprendiz(r){
  return normalize(r.cargo).includes('APRENDIZ');
}

// Verifica se a sub-unidade da Cozinha Central tem algum centro de custo dela selecionado no filtro
function subunitSelected(name){
  for(const cc of state.selectedCentrosCusto){
    if(classifyCentralSubunit(cc) === name) return true;
  }
  return false;
}

function excelSerialToDate(serial){
  const utcDays = Math.floor(serial - 25569);
  const utcValue = utcDays * 86400;
  const date = new Date(utcValue * 1000);
  const fractional = serial - Math.floor(serial);
  const totalSeconds = Math.round(fractional * 86400);
  date.setSeconds(date.getSeconds()+totalSeconds);
  return new Date(date.getUTCFullYear(), date.getUTCMonth(), date.getUTCDate());
}

function parseDateValue(v){
  if(v===null || v===undefined || v==='') return null;
  if(v instanceof Date){ return isNaN(v.getTime()) ? null : new Date(v.getFullYear(),v.getMonth(),v.getDate()); }
  if(typeof v === 'number'){ return excelSerialToDate(v); }
  if(typeof v === 'string'){
    const s = v.trim();
    if(!s) return null;
    let m = s.match(/^(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
    if(m){
      let d=parseInt(m[1],10), mo=parseInt(m[2],10), y=parseInt(m[3],10);
      if(m[3].length===2) y += 2000;
      const dt = new Date(y, mo-1, d);
      return isNaN(dt.getTime()) ? null : dt;
    }
    m = s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
    if(m){
      const dt = new Date(parseInt(m[1],10), parseInt(m[2],10)-1, parseInt(m[3],10));
      return isNaN(dt.getTime()) ? null : dt;
    }
    const parsed = new Date(s);
    return isNaN(parsed.getTime()) ? null : new Date(parsed.getFullYear(),parsed.getMonth(),parsed.getDate());
  }
  return null;
}

function matchStoreKey(lojaRaw){
  const n = normalize(lojaRaw);
  if(!n) return null;
  if(METAS_HISTORY[n]) return n;
  for(const key of STORE_KEYS){
    if(normalize(key)===n) return key;
  }
  // Remove o código numérico ("23-") do início, pra comparar só o nome
  const stripCode = s => s.replace(/^\d+-\s*/,'');
  // Remove também a palavra "CABANA", pra tolerar bases que a omitem (ex: "23-BOTAFOGO" vs "23-CABANA BOTAFOGO")
  const stripCabana = s => stripCode(s).replace(/^CABANA\s+/,'').trim();

  const nNoCode = stripCode(n);
  const nCore = stripCabana(n);

  for(const key of STORE_KEYS){
    const nk = normalize(key);
    if(stripCode(nk) === nNoCode) return key;
  }
  for(const key of STORE_KEYS){
    const nk = normalize(key);
    if(stripCabana(nk) === nCore) return key;
  }
  for(const key of STORE_KEYS){
    const nk = normalize(key);
    const keyCore = stripCabana(nk);
    if(nCore.includes(keyCore) || keyCore.includes(nCore)) return key;
  }
  return null;
}

function classifyArea(centroCusto){
  const cc = normalize(centroCusto);
  if(cc.includes('LIDER')) return 'lideranca';
  if(cc.includes('SALÃO') || cc.includes('SALAO') || cc.includes('DELIVERY')) return 'salao';
  if(cc.includes('COZINHA') || cc.includes('BAR')) return 'cozinha';
  return 'outros';
}

/* =========================================================
   4. INDEXEDDB
   ========================================================= */
function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open('cabanaHeadcountDB', 1);
    req.onupgradeneeded = e=>{
      const db = e.target.result;
      if(!db.objectStoreNames.contains('dataset')) db.createObjectStore('dataset');
    };
    req.onsuccess = e=>resolve(e.target.result);
    req.onerror = e=>reject(e);
  });
}
async function idbSet(key,val){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('dataset','readwrite');
    tx.objectStore('dataset').put(val,key);
    tx.oncomplete = ()=>resolve();
    tx.onerror = e=>reject(e);
  });
}
async function idbGet(key){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('dataset','readonly');
    const req = tx.objectStore('dataset').get(key);
    req.onsuccess = ()=>resolve(req.result);
    req.onerror = e=>reject(e);
  });
}
async function idbClear(){
  const db = await openDB();
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('dataset','readwrite');
    tx.objectStore('dataset').clear();
    tx.oncomplete = ()=>resolve();
    tx.onerror = e=>reject(e);
  });
}

/* =========================================================
   5. PARSE EXCEL
   ========================================================= */
function findColumn(row, candidates){
  const keys = Object.keys(row);
  for(const c of candidates){
    const found = keys.find(k=>k.trim().toUpperCase()===c.toUpperCase());
    if(found) return found;
  }
  return null;
}
function findCentroCustoColumn(row){
  const keys = Object.keys(row);
  return keys.find(k=>/centro/i.test(k) && /custo/i.test(k)) || null;
}

function parseWorkbook(arrayBuffer){
  const wb = XLSX.read(arrayBuffer, {type:'array', cellDates:true});
  const sheet = wb.Sheets[wb.SheetNames[0]];
  const rows = XLSX.utils.sheet_to_json(sheet, {defval:null});
  if(!rows.length) return [];

  const colNome = findColumn(rows[0], ['Nome']);
  const colCargo = findColumn(rows[0], ['Cargo']);
  const colLoja = findColumn(rows[0], ['Nome Fantasia','Loja']);
  const colAdm = findColumn(rows[0], ['Dt Admissão','Data Admissão']);
  const colResc = findColumn(rows[0], ['Dt Rescisão','Data Rescisão']);
  const colCC = findCentroCustoColumn(rows[0]);

  const out = [];
  rows.forEach(row=>{
    const nome = colNome ? row[colNome] : null;
    const lojaRaw = colLoja ? row[colLoja] : null;
    if(!nome && !lojaRaw) return;
    const admissao = colAdm ? parseDateValue(row[colAdm]) : null;
    const rescisao = colResc ? parseDateValue(row[colResc]) : null;
    const centroCusto = colCC ? row[colCC] : '';
    const storeKey = matchStoreKey(lojaRaw);
    out.push({
      nome: nome || '',
      cargo: colCargo ? (row[colCargo]||'') : '',
      lojaRaw: lojaRaw || '',
      storeKey,
      centroCusto: centroCusto || '',
      admissao,
      rescisao
    });
  });
  return out;
}

/* =========================================================
   6. MESES DISPONÍVEIS
   ========================================================= */
function computeAvailableMonths(records){
  if(!records.length) return [];
  let minDate = null, maxDate = new Date();
  records.forEach(r=>{
    if(r.admissao && (!minDate || r.admissao < minDate)) minDate = r.admissao;
    if(r.admissao && r.admissao > maxDate) maxDate = r.admissao;
    if(r.rescisao && r.rescisao > maxDate) maxDate = r.rescisao;
  });
  if(!minDate) minDate = new Date();
  const months = [];
  let cur = new Date(minDate.getFullYear(), minDate.getMonth(), 1);
  const end = new Date(maxDate.getFullYear(), maxDate.getMonth(), 1);
  while(cur <= end){
    months.push({year:cur.getFullYear(), month:cur.getMonth()});
    cur = new Date(cur.getFullYear(), cur.getMonth()+1, 1);
  }
  months.reverse();
  return months;
}

/* =========================================================
   7. CÁLCULOS
   ========================================================= */
function monthKey(d){ return d.getFullYear()*12 + d.getMonth(); }

function getCountsForStoreMonth(storeKey, year, month){
  const targetKey = year*12 + month;
  const counts = {lideranca:0, salao:0, cozinha:0, total:0};
  const seenTotal = new Set();
  const seenArea = {lideranca:new Set(), salao:new Set(), cozinha:new Set()};
  for(const r of state.records){
    if(r.storeKey !== storeKey) continue;
    if(!centroCustoAllowed(r)) continue;
    if(isAprendiz(r)) continue;
    if(r.admissao && monthKey(r.admissao) > targetKey) continue;   // admitido depois do mês avaliado
    if(r.rescisao && monthKey(r.rescisao) <= targetKey) continue;  // rescisão no próprio mês avaliado ou antes (dia não importa)
    // sem Dt Rescisão, ou rescisão em mês posterior ao avaliado => considera ativo
    const personKey = normalize(r.nome);
    if(!seenTotal.has(personKey)){ seenTotal.add(personKey); counts.total++; }
    const area = classifyArea(r.centroCusto);
    if(area==='lideranca' && !seenArea.lideranca.has(personKey)){ seenArea.lideranca.add(personKey); counts.lideranca++; }
    else if(area==='salao' && !seenArea.salao.has(personKey)){ seenArea.salao.add(personKey); counts.salao++; }
    else if(area==='cozinha' && !seenArea.cozinha.has(personKey)){ seenArea.cozinha.add(personKey); counts.cozinha++; }
  }
  return counts;
}

function monthsBack(year, month, offset){
  const d = new Date(year, month-offset, 1);
  return {year:d.getFullYear(), month:d.getMonth()};
}

/* ---------- Cálculos de Turnover ---------- */
function getTotalAtivos(stores, year, month){
  let sum = 0;
  stores.forEach(k=>{ sum += getCountsForStoreMonth(k,year,month).total; });
  return sum;
}

function admEventKey(r){ return normalize(r.nome)+'|'+r.storeKey+'|'+r.admissao.getTime(); }
function demEventKey(r){ return normalize(r.nome)+'|'+r.storeKey+'|'+r.rescisao.getTime(); }

function getAdmissoesDemissoesMes(stores, year, month){
  let adm = 0, dem = 0;
  const seenAdm = new Set(), seenDem = new Set();
  state.records.forEach(r=>{
    if(!r.storeKey || !stores.includes(r.storeKey)) return;
    if(!centroCustoAllowed(r)) return;
    if(isAprendiz(r)) return; // Jovem Aprendiz não entra no turnover
    if(r.admissao && r.admissao.getFullYear()===year && r.admissao.getMonth()===month){
      const admKey = admEventKey(r);
      if(!seenAdm.has(admKey) && !state.excludedAdm.has(admKey)){ seenAdm.add(admKey); adm++; }
    }
    if(r.rescisao && r.rescisao.getFullYear()===year && r.rescisao.getMonth()===month){
      const demKey = demEventKey(r);
      if(!seenDem.has(demKey) && !state.excludedDem.has(demKey)){ seenDem.add(demKey); dem++; }
    }
  });
  return {adm, dem};
}

// Listas nominais de eventos do mês (sem aplicar exclusões — inclui flag "excluded" para a UI)
function getAdmissoesListMes(stores, year, month){
  const seen = new Set();
  const list = [];
  state.records.forEach(r=>{
    if(!r.storeKey || !stores.includes(r.storeKey)) return;
    if(!centroCustoAllowed(r)) return;
    if(isAprendiz(r)) return; // Jovem Aprendiz não entra no turnover
    if(!r.admissao || r.admissao.getFullYear()!==year || r.admissao.getMonth()!==month) return;
    const key = admEventKey(r);
    if(seen.has(key)) return;
    seen.add(key);
    list.push({key, r, excluded: state.excludedAdm.has(key)});
  });
  list.sort((a,b)=> a.r.nome.localeCompare(b.r.nome));
  return list;
}
function getDemissoesListMes(stores, year, month){
  const seen = new Set();
  const list = [];
  state.records.forEach(r=>{
    if(!r.storeKey || !stores.includes(r.storeKey)) return;
    if(!centroCustoAllowed(r)) return;
    if(isAprendiz(r)) return; // Jovem Aprendiz não entra no turnover
    if(!r.rescisao || r.rescisao.getFullYear()!==year || r.rescisao.getMonth()!==month) return;
    const key = demEventKey(r);
    if(seen.has(key)) return;
    seen.add(key);
    list.push({key, r, excluded: state.excludedDem.has(key)});
  });
  list.sort((a,b)=> a.r.nome.localeCompare(b.r.nome));
  return list;
}

// Turnover do mês = ((Admissões + Demissões) / 2) ÷ Total de colaboradores ativos no mês
function turnoverRateMes(stores, year, month){
  const {adm, dem} = getAdmissoesDemissoesMes(stores, year, month);
  const total = getTotalAtivos(stores, year, month);
  if(total <= 0) return 0;
  return ((adm+dem)/2) / total * 100;
}

// Turnover acumulado nos últimos N meses = Σ demissões ÷ média de ativos no período
function turnoverAcumulado(stores, year, month, monthsWindow){
  let sumDem = 0, sumTotal = 0;
  for(let i=0;i<monthsWindow;i++){
    const {year:y, month:m} = monthsBack(year, month, i);
    sumDem += getAdmissoesDemissoesMes(stores,y,m).dem;
    sumTotal += getTotalAtivos(stores,y,m);
  }
  const avgTotal = sumTotal / monthsWindow;
  if(avgTotal <= 0) return 0;
  return (sumDem / avgTotal) * 100;
}

function getWindowRange(year, month, monthsWindow){
  const end = new Date(year, month+1, 0);
  const startRef = monthsBack(year, month, monthsWindow-1);
  const start = new Date(startRef.year, startRef.month, 1);
  return {start, end};
}

// Desligamentos (eventos de rescisão) dentro de uma janela, deduplicados por pessoa+data
function getDismissalsInWindow(stores, year, month, monthsWindow){
  const {start, end} = getWindowRange(year, month, monthsWindow);
  const seen = new Set();
  const result = [];
  state.records.forEach(r=>{
    if(!r.storeKey || !stores.includes(r.storeKey)) return;
    if(!centroCustoAllowed(r)) return;
    if(isAprendiz(r)) return; // Jovem Aprendiz não entra no turnover
    if(!r.rescisao) return;
    if(r.rescisao < start || r.rescisao > end) return;
    const key = demEventKey(r);
    if(seen.has(key) || state.excludedDem.has(key)) return;
    seen.add(key);
    result.push(r);
  });
  return result;
}

function tenureMonths(r){
  if(!r.admissao || !r.rescisao) return null;
  const diffMs = r.rescisao.getTime() - r.admissao.getTime();
  if(diffMs < 0) return null;
  return diffMs / (1000*60*60*24*30.44);
}

const TENURE_BUCKETS = ['< 3 meses','3-6 meses','6-12 meses','1-2 anos','2-5 anos','5+ anos','Sem admissão'];
function tenureBucket(months){
  if(months===null) return 'Sem admissão';
  if(months<3) return '< 3 meses';
  if(months<6) return '3-6 meses';
  if(months<12) return '6-12 meses';
  if(months<24) return '1-2 anos';
  if(months<60) return '2-5 anos';
  return '5+ anos';
}

function countByKey(list, keyFn){
  const map = new Map();
  list.forEach(item=>{
    const k = keyFn(item);
    map.set(k, (map.get(k)||0)+1);
  });
  return map;
}

function getCurrentMode(){
  const ccSet = BU_MAP['Cozinha Central'];
  if(state.selectedStores.size === ccSet.length && ccSet.every(k=>state.selectedStores.has(k))){
    return 'lideq';
  }
  return 'areas';
}

function buildRowsCC(){
  const {year, month} = state.selectedMonth;
  const counts = getCozinhaCentralCounts(year, month);
  const rows = [];
  COZINHA_CENTRAL_SUBUNIT_KEYS.forEach(name=>{
    if(!subunitSelected(name)) return; // filtro de Centro de Custo excluiu essa sub-unidade (meta some junto com o real)
    const metaVersion = getMetaForSubunitMonth(name, year, month);
    const real = counts[name];
    if(!metaVersion && real.total===0) return;
    const meta = metaVersion || {lideranca:0, equipe:0};
    const mTotal = meta.lideranca + meta.equipe;
    rows.push({storeKey:name, meta, mTotal, real, dif: real.total-mTotal, mode:'lideq'});
  });
  if(counts['Outros'] && counts['Outros'].total>0){
    rows.push({storeKey:'Outros (sem meta)', meta:{lideranca:0,equipe:0}, mTotal:0, real:counts['Outros'], dif:counts['Outros'].total, mode:'lideq'});
  }
  if(state.sortDir === 'asc') rows.sort((a,b)=> a.dif - b.dif);
  else if(state.sortDir === 'desc') rows.sort((a,b)=> b.dif - a.dif);
  return rows;
}

function buildRows(){
  if(getCurrentMode() === 'lideq') return buildRowsCC();
  const stores = STORE_KEYS.filter(k=>state.selectedStores.has(k));
  const {year, month} = state.selectedMonth;
  const rows = stores
    .map(storeKey=>{
      const real = getCountsForStoreMonth(storeKey, year, month);
      const metaVersion = getMetaForStoreMonth(storeKey, year, month);
      // Se não há meta vigente nessa competência mas já existem pessoas ativas na loja,
      // ainda assim mostramos a linha (meta = 0) para não escondermos headcount real.
      if(!metaVersion && real.total === 0) return null; // loja de fato ainda não existe nessa competência
      const meta = metaVersion || {lideranca:0, salao:0, cozinha:0};
      const mTotal = meta.lideranca + meta.salao + meta.cozinha;
      return {storeKey, meta, mTotal, real, dif: real.total - mTotal, mode:'areas'};
    })
    .filter(Boolean);
  if(state.sortDir === 'asc') rows.sort((a,b)=> a.dif - b.dif);
  else if(state.sortDir === 'desc') rows.sort((a,b)=> b.dif - a.dif);
  return rows;
}

function updateHeaderInfo(){

    sub.parentNode.appendChild(p);
  }

  monthSelect.innerHTML = state.availableMonths.map((m,i)=>
    `<option value="${i}">${fmtMonth(m.year,m.month)}</option>`
  ).join('');
  const selectedIdx = state.availableMonths.findIndex(m=>m.year===state.selectedMonth.year && m.month===state.selectedMonth.month);
  monthSelect.value = selectedIdx>=0 ? selectedIdx : 0;

  // Unidade de negócio: SegmentedControl do kit. É um atalho que marca as lojas da BU no filtro de Lojas.
  const BU_OPTIONS = ['Todas', ...BU_NAMES];
  function detectActiveBU(){
    const matches = (set) => set.length === state.selectedStores.size && set.every(k=>state.selectedStores.has(k));
    if(matches(defaultStoresForBU('Todas'))) return 'Todas';
    for(const bu of BU_NAMES){
      if(matches(defaultStoresForBU(bu))) return bu;
    }
    return null;
  }
  const buSeg = CabanaData.SegmentedControl(document.getElementById('buSeg'), {
    options: BU_OPTIONS.map(n=>({value:n, label:n})),
    value: 'Todas',
    label: 'Unidade de negócio',
    onChange: (bu)=>{
      state.selectedBU = bu;
      state.selectedStores = new Set(defaultStoresForBU(bu));
      renderStoreOptions();
      updateStoreDropdownLabel();
      updateBUPillsUI();
      onStoreSelectionChanged();
    }
  });
  // Seleção personalizada de lojas: nenhuma opção marcada (a pílula some)
  function updateBUPillsUI(){
    const active = detectActiveBU();
    const pill = buSeg.el.querySelector('.cd-seg-pill');
    if(active){ buSeg.set(active); if(pill) pill.style.opacity = ''; }
    else {
      if(pill) pill.style.opacity = '0';
      buSeg.el.querySelectorAll('.cd-seg-btn').forEach(b=>b.setAttribute('aria-checked', 'false'));
    }
  }
  updateBUPillsUI();

  // Store options (ordenadas alfabeticamente)
  const sortedStoreKeys = [...VISIBLE_STORE_KEYS].sort((a,b)=>a.localeCompare(b));
  const storeOptions = document.getElementById('storeOptions');
  function renderStoreOptions(){
    storeOptions.innerHTML = sortedStoreKeys.map(key=>`
      <label class="store-opt">
        <input type="checkbox" value="${key}" ${state.selectedStores.has(key)?'checked':''}/>
        <span>${key}</span>
      </label>
    `).join('');
    storeOptions.querySelectorAll('input[type=checkbox]').forEach(cb=>{
      cb.addEventListener('change', ()=>{
        if(cb.checked) state.selectedStores.add(cb.value);
        else state.selectedStores.delete(cb.value);
        updateStoreDropdownLabel();
        updateBUPillsUI();
        onStoreSelectionChanged();
      });
    });
  }
  renderStoreOptions();
  updateStoreDropdownLabel();

  // Dropdown toggle
  const panel = document.getElementById('storePanel');
  document.getElementById('storeDropdownBtn').onclick = (e)=>{
    e.stopPropagation();
    document.getElementById('ccPanel').classList.remove('open');
    panel.classList.toggle('open');
  };
  const storeBtn = document.getElementById('storeDropdownBtn');
  document.addEventListener('click', (e)=>{
    if(!panel.contains(e.target) && !storeBtn.contains(e.target)) panel.classList.remove('open');
  });

  document.getElementById('selectAllStores').onclick = ()=>{
    // "Selecionar todas" marca o conjunto padrão (sem Sto André e Rib. Preto, que só entram se marcadas manualmente)
    state.selectedStores = new Set(DEFAULT_STORE_KEYS);
    storeOptions.querySelectorAll('input[type=checkbox]').forEach(cb=>{ cb.checked = state.selectedStores.has(cb.value); });
    updateStoreDropdownLabel();
    updateBUPillsUI();
    onStoreSelectionChanged();
  };
  document.getElementById('deselectAllStores').onclick = ()=>{
    state.selectedStores.clear();
    storeOptions.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.checked=false);
    updateStoreDropdownLabel();
    updateBUPillsUI();
    onStoreSelectionChanged();
  };

  // Centro de Custo options — dependem das lojas selecionadas no momento
  const ccOptions = document.getElementById('ccOptions');
  const ccPanel = document.getElementById('ccPanel');

  function renderCCOptions(){
    const ccList = getCentroCustoOptions();
    const prevSelected = state.selectedCentrosCusto;
    // Só preserva a seleção anterior se o conjunto de opções disponíveis não mudou
    // (ex.: o usuário desmarcou um checkbox manualmente). Se a lista de opções mudou
    // (ex.: troca de BU/loja com centros de custo diferentes), reseta para tudo selecionado.
    // Preservar a interseção nesse caso já causou um bug grave: ao trocar de Cozinha Central
    // para Operações, "Liderança Loja"/"Salão e Delivery"/"Cozinha e Bar" ficavam de fora
    // (não estavam na seleção anterior, restrita a Produção/Logística), zerando o real das lojas.
    const isSameOptionSet = ccList.length === prevSelected.size && ccList.every(cc => prevSelected.has(cc));
    if(!isSameOptionSet){
      state.selectedCentrosCusto = new Set(ccList);
    }
    ccOptions.innerHTML = ccList.map(cc=>`
      <label class="store-opt">
        <input type="checkbox" value="${cc.replace(/"/g,'&quot;')}" ${state.selectedCentrosCusto.has(cc)?'checked':''}/>
        <span>${cc || '(Sem centro de custo)'}</span>
      </label>
    `).join('');
    updateCCDropdownLabel();
    ccOptions.querySelectorAll('input[type=checkbox]').forEach(cb=>{
      cb.addEventListener('change', ()=>{
        if(cb.checked) state.selectedCentrosCusto.add(cb.value);
        else state.selectedCentrosCusto.delete(cb.value);
        updateCCDropdownLabel();
        recalcAll();
      });
    });
  }

  function onStoreSelectionChanged(){
    renderCCOptions(); // a lista de centros de custo disponíveis muda com as lojas selecionadas
    recalcAll();
  }

  renderCCOptions();

  document.getElementById('ccDropdownBtn').onclick = (e)=>{
    e.stopPropagation();
    panel.classList.remove('open');
    ccPanel.classList.toggle('open');
  };
  const ccBtn = document.getElementById('ccDropdownBtn');
  document.addEventListener('click', (e)=>{
    if(!ccPanel.contains(e.target) && !ccBtn.contains(e.target)) ccPanel.classList.remove('open');
  });

  document.getElementById('selectAllCC').onclick = ()=>{
    const ccList = getCentroCustoOptions();
    ccList.forEach(cc=>state.selectedCentrosCusto.add(cc));
    ccOptions.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.checked=true);
    updateCCDropdownLabel();
    recalcAll();
  };
  document.getElementById('deselectAllCC').onclick = ()=>{
    state.selectedCentrosCusto.clear();
    ccOptions.querySelectorAll('input[type=checkbox]').forEach(cb=>cb.checked=false);
    updateCCDropdownLabel();
    recalcAll();
  };

  document.getElementById('btnApply').onclick = ()=>{
    const idx = parseInt(monthSelect.value,10);
    state.selectedMonth = state.availableMonths[idx];
    recalcAll();
  };

  document.getElementById('btnExportImg').onclick = exportAsImage;
  document.getElementById('btnGerarBase').onclick = gerarBaseAtivos;
  document.getElementById('btnAdjustAdm').onclick = ()=>openAdjustModal('adm');
  document.getElementById('btnAdjustDem').onclick = ()=>openAdjustModal('dem');

  document.getElementById('btnSortMedia').onclick = ()=>{
    if(state.diagSortDir === null) state.diagSortDir = 'asc';
    else if(state.diagSortDir === 'asc') state.diagSortDir = 'desc';
    else state.diagSortDir = null;
    updateDiagSortLabel();
    recalcDiagnostico();
  };
  updateDiagSortLabel();
  document.getElementById('btnExportHeatmap').onclick = ()=>exportDiagCard('diagHeatmapCard','btnExportHeatmap','Evolução do Fechamento do Quadro','EvolucaoQuadro');
  document.getElementById('btnExportMgr').onclick = ()=>exportDiagCard('diagMgrCard','btnExportMgr','Eficiência de Gestão por Loja — Contratação e Retenção','EficienciaGestao');

  document.getElementById('btnSortDif').onclick = ()=>{
    if(state.sortDir === null) state.sortDir = 'desc';
    else if(state.sortDir === 'desc') state.sortDir = 'asc';
    else state.sortDir = null;
    updateSortButtonLabel();
    recalcAll();
  };
  updateSortButtonLabel();

  // Abas: SegmentedControl do kit, no cabeçalho
  const TAB_PANELS = {headcount:'tabPanelHeadcount', turnover:'tabPanelTurnover', diagnostico:'tabPanelDiagnostico'};
  function showTab(tab){
    state.activeTab = tab;
    Object.entries(TAB_PANELS).forEach(([k,id])=>{
      document.getElementById(id).style.display = k===tab ? '' : 'none';
    });
    // gráficos criados com a aba escondida recalculam o tamanho ao aparecer
    Object.values(state.charts).forEach(ch=>{ if(ch && typeof ch.resize === 'function') ch.resize(); });
  }
  CabanaData.SegmentedControl(document.getElementById('appTabs'), {
    options:[{value:'headcount', label:'Quadro'}, {value:'turnover', label:'Turnover'}, {value:'diagnostico', label:'Diagnóstico'}],
    value: state.activeTab,
    label: 'Seções do painel',
    onChange: showTab
  });
  showTab(state.activeTab);

  initCharts();
  initTurnoverCharts();

  // Definições (ⓘ) e rodapé de fonte de cada painel
  dash.querySelectorAll('[data-def]').forEach(el=>el.appendChild(CabanaData.InfoTip(el.dataset.def)));
  updateFoots();
}

function updateSortButtonLabel(){
  const btn = document.getElementById('btnSortDif');
  if(!btn) return;
  let t = 'Ordenar por diferença';
  if(state.sortDir === 'desc') t = 'Diferença: maior → menor';
  else if(state.sortDir === 'asc') t = 'Diferença: menor → maior';
  btn.innerHTML = `<span>${t}</span>`;
}

function updateStoreDropdownLabel(){
  const label = document.getElementById('storeDropdownLabel');
  const n = state.selectedStores.size;
  const isDefaultAll = n === DEFAULT_STORE_KEYS.length && DEFAULT_STORE_KEYS.every(k=>state.selectedStores.has(k));
  if(isDefaultAll) label.textContent = 'Todas (exceto Sto André e Rib. Preto)';
  else if(n === VISIBLE_STORE_KEYS.length) label.textContent = 'Todas as lojas';
  else if(n === 0) label.textContent = 'Nenhuma loja selecionada';
  else label.textContent = n + ' loja(s) selecionada(s)';
}

function getCentroCustoOptions(){
  const set = new Set();
  state.records.forEach(r=>{
    if(!r.storeKey || !state.selectedStores.has(r.storeKey)) return;
    set.add(normalize(r.centroCusto));
  });
  return Array.from(set).sort((a,b)=>a.localeCompare(b));
}

function updateCCDropdownLabel(){
  const label = document.getElementById('ccDropdownLabel');
  if(!label) return;
  const total = getCentroCustoOptions().length;
  const n = state.selectedCentrosCusto.size;
  if(n === total) label.textContent = 'Todos os centros de custo';
  else if(n === 0) label.textContent = 'Nenhum centro de custo selecionado';
  else label.textContent = n + ' selecionado(s)';
}

/* =========================================================
   10. CHARTS (Chart.js lendo as cores dos tokens do Cabana Digital)
   ========================================================= */
function tok(name){ return getComputedStyle(document.getElementById('root')).getPropertyValue(name).trim(); }
function chartTheme(){
  return {
    brand: tok('--dado-series-1'), ink: tok('--dado-ink'), muted: tok('--dado-ink-muted'), subtle: tok('--dado-ink-subtle'),
    border: tok('--dado-border'), target: tok('--dado-target'), prev: tok('--dado-series-prev'),
    inverse: tok('--dado-ink-inverse'), bg: tok('--dado-bg'), font: tok('--font-sans') || 'sans-serif'
  };
}
function applyChartDefaults(){
  const T = chartTheme();
  Chart.defaults.font.family = T.font;
  Chart.defaults.font.size = 12;
  Chart.defaults.color = T.muted;
  Chart.defaults.borderColor = T.border;
  Chart.defaults.plugins.legend.labels.usePointStyle = true;
  Chart.defaults.plugins.legend.labels.boxWidth = 8;
  Chart.defaults.animation.duration = 280;
}
// Eixos no padrão do kit: grade só horizontal, sem linha de eixo, 3 a 4 marcas, rótulo do X sem girar
function axisY(extra){
  const T = chartTheme();
  return Object.assign({ beginAtZero:true, border:{display:false}, grid:{color:T.border, drawTicks:false}, ticks:{maxTicksLimit:4, padding:8, precision:0} }, extra || {});
}
function axisX(){
  const T = chartTheme();
  return { border:{color:T.border}, grid:{display:false}, ticks:{maxRotation:0, autoRotate:false, autoSkip:true, padding:6} };
}

function initCharts(){

        { type:'line', label:'Orçado', data:[], borderColor:T.prev, borderDash:[2,3], borderWidth:2, pointRadius:0, pointHoverRadius:4, fill:false, tension:0, order:2, labelColor:T.subtle }
      ]
    },
    options: {

  });

  const areaCtx = document.getElementById('chartArea').getContext('2d');

        { label:'Orçado', data:[0,0,0], backgroundColor:T.prev, borderRadius:{topLeft:3, topRight:3}, labelColor:T.muted },
        { label:'Real', data:[0,0,0], backgroundColor:T.brand, borderRadius:{topLeft:3, topRight:3}, labelColor:T.ink }
      ]
    },
    options:{

// Valor em cima das barras
function valueLabelPlugin(suffix){
  return {
    id:'valueLabel_'+suffix+Math.random(),
    afterDatasetsDraw(chart){
      const {ctx} = chart;
      const T = chartTheme();
      chart.data.datasets.forEach((ds, dsIndex)=>{
        const meta = chart.getDatasetMeta(dsIndex);
        if(meta.type !== 'bar' || meta.hidden) return;
        meta.data.forEach((bar, i)=>{
          const val = ds.data[i];
          if(val===undefined||val===null) return;
          ctx.save();
          ctx.fillStyle = ds.labelColor || T.ink;
          ctx.font = '500 12px ' + T.font;
          ctx.textAlign = 'center';
          ctx.fillText(suffix==='%' ? Math.round(val)+'%' : val, bar.x, bar.y - 6);
          ctx.restore();
        });
      });
    }
  };
}
// Linha de referência horizontal (ex.: 100% da meta), com rótulo
function targetLinePlugin(value, color){
  return {
    id:'targetLine_'+value,
    afterDraw(chart){
      const yScale = chart.scales.y;
      const {ctx, chartArea} = chart;
      const T = chartTheme();
      const y = yScale.getPixelForValue(value);
      ctx.save();
      ctx.strokeStyle = color || T.target;
      ctx.setLineDash([6,4]);
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(chartArea.left, y);
      ctx.lineTo(chartArea.right, y);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.fillStyle = color || T.target;
      ctx.font = '500 12px ' + T.font;
      ctx.textAlign = 'right';
      ctx.fillText('Meta ' + value + '%', chartArea.right, y - 6);
      ctx.restore();
    }
  };
}
// Rótulos de dados do gráfico LTM: valor dentro das barras e acima das linhas
function ltmLabelPlugin(){
  return {
    id:'ltmLabels',
    afterDatasetsDraw(chart){
      const {ctx} = chart;
      const T = chartTheme();
      chart.data.datasets.forEach((ds, dsIndex)=>{
        const meta = chart.getDatasetMeta(dsIndex);
        meta.data.forEach((el, i)=>{
          const val = ds.data[i];
          if(val===undefined || val===null) return;
          ctx.save();
          ctx.font = '500 12px ' + T.font;
          ctx.textAlign = 'center';
          if(meta.type === 'bar'){
            ctx.fillStyle = T.inverse;
            ctx.textBaseline = 'middle';
            ctx.fillText(val, el.x, (el.y + el.base) / 2);
          } else if(meta.type === 'line'){
            // fundo branco atrás do número para ele não se perder sobre as barras
            const txt = String(val), yy = el.y - (dsIndex === 1 ? 10 : -16);
            const w = ctx.measureText(txt).width + 8;
            ctx.fillStyle = T.bg;
            ctx.fillRect(el.x - w/2, yy - 9, w, 18);
            ctx.fillStyle = ds.labelColor || ds.borderColor;
            ctx.textBaseline = 'middle';
            ctx.fillText(txt, el.x, yy);
          }
          ctx.restore();
        });
      });
    }
  };
}
// Nome da linha na ponta dela (o kit pede isso no lugar de legenda)
function endLabelPlugin(){
  return {
    id:'endLabels',
    afterDatasetsDraw(chart){
      const {ctx, chartArea} = chart;
      const T = chartTheme();
      chart.data.datasets.forEach((ds, dsIndex)=>{
        const meta = chart.getDatasetMeta(dsIndex);
        if(meta.type !== 'line') return;
        let idx = ds.data.length - 1;
        while(idx >= 0 && (ds.data[idx] === null || ds.data[idx] === undefined)) idx--;
        if(idx < 0 || !meta.data[idx]) return;
        const el = meta.data[idx];
        ctx.save();
        ctx.font = '500 12px ' + T.font;
        ctx.fillStyle = ds.labelColor || ds.borderColor;
        ctx.textAlign = 'left';
        ctx.textBaseline = 'middle';
        ctx.fillText(ds.label, Math.min(el.x + 8, chartArea.right + 8), el.y);
        ctx.restore();
      });
    }
  };
}

/* =========================================================
   11. RECALC / RENDER DATA
   ========================================================= */
function recalcAll(){
  const rows = buildRows();
  const mode = getCurrentMode();
  const totalMeta = {lideranca:0, salao:0, cozinha:0, equipe:0, total:0};
  const totalReal = {lideranca:0, salao:0, cozinha:0, equipe:0, total:0};
  rows.forEach(r=>{
    totalMeta.lideranca += r.meta.lideranca;
    totalReal.lideranca += r.real.lideranca;
    if(r.mode === 'lideq'){
      totalMeta.equipe += r.meta.equipe;
      totalReal.equipe += r.real.equipe;
    } else {
      totalMeta.salao += r.meta.salao;
      totalMeta.cozinha += r.meta.cozinha;
      totalReal.salao += r.real.salao;
      totalReal.cozinha += r.real.cozinha;
    }
    totalMeta.total += r.mTotal;
    totalReal.total += r.real.total;
  });

  renderKPIs(totalMeta, totalReal, rows, mode);
  renderTable(rows, totalMeta, totalReal, mode);
  updateChartArea(totalMeta, totalReal, mode);
  updateChartPct(totalMeta, totalReal, mode);
  updateChartLTM(totalMeta.total);
  recalcTurnover();
  recalcDiagnostico();

  document.getElementById('exportHeaderSub').textContent =
    `${fmtMonth(state.selectedMonth.year, state.selectedMonth.month)} · ${rows.length} ${mode==='lideq'?'unidade(s)':'loja(s)'} · gerado em ${fmtDateBR(new Date())}`;
}

function setKpi(id, text){ const el = document.getElementById(id); if(el) el.textContent = text; }
function fmtSignedInt(n){ return n > 0 ? '+' + n : (n < 0 ? MENOS + Math.abs(n) : '0'); }

function fillDiffKpi(id, diff, base, compText){
  setKpi(id, fmtSignedInt(diff));
  const foot = document.getElementById(id + 'Foot');
  if(!foot) return;
  foot.innerHTML = '';
  const pct = base > 0 ? (diff / base) * 100 : null;
  foot.appendChild(CabanaData.Delta(pct, {}));
  const c = document.createElement('span');
  c.className = 'cd-kpi-comp';
  c.textContent = compText;
  foot.appendChild(c);
}

function renderKPIs(totalMeta, totalReal, rows, mode){
  setKpi('kpiMeta', totalMeta.total);
  const orcado = orcadoTotalFrom(totalMeta.lideranca, totalMeta.total - totalMeta.lideranca, mode);
  setKpi('kpiOrcado', orcado);
  setKpi('kpiOrcadoSub', mode === 'lideq' ? 'Igual à meta' : 'Liderança igual à meta; demais −8,5%');
  setKpi('kpiReal', totalReal.total);

  const dif = totalReal.total - totalMeta.total;
  const difOrcado = totalReal.total - orcado;
  fillDiffKpi('kpiDif', dif, totalMeta.total, 'da meta de ' + totalMeta.total);
  fillDiffKpi('kpiDifOrcado', difOrcado, orcado, 'do orçado de ' + orcado);

  const onTarget = rows.filter(r=>r.real.total >= r.mTotal).length;
  setKpi('kpiLojasMeta', `${onTarget} de ${rows.length} ${mode === 'lideq' ? 'unidades' : 'lojas'} na meta`);
}

const ARROW_UP = '<svg viewBox="0 0 10 10"><path d="M5 1.5 9 8H1z" fill="currentColor"/></svg>';
const ARROW_DOWN = '<svg viewBox="0 0 10 10"><path d="M5 8.5 1 2h8z" fill="currentColor"/></svg>';
const ARROW_FLAT = '<svg viewBox="0 0 10 10"><rect x="1.5" y="4" width="7" height="2" rx="1" fill="currentColor"/></svg>';

// Variação com seta, sinal e cor (nunca só cor), no formato do Delta do kit
function deltaHtml(v, texto){
  const tone = v > 0 ? 'positive' : (v < 0 ? 'negative' : 'neutral');
  const arrow = v > 0 ? ARROW_UP : (v < 0 ? ARROW_DOWN : ARROW_FLAT);
  const sr = v > 0 ? 'acima em ' : (v < 0 ? 'abaixo em ' : 'igual: ');
  return `<span class="cd-delta cd-delta-plain cd-delta-${tone}" aria-label="${sr}${texto}"><span class="cd-delta-arrow" aria-hidden="true">${arrow}</span>${texto}</span>`;
}
function deltaPessoas(v){ return deltaHtml(v, fmtSignedInt(v)); }

function renderTableHead(mode){
  const thead = document.getElementById('tableHead');
  if(mode === 'lideq'){
    thead.innerHTML = `
      <tr>
        <th rowspan="2">Unidade</th>
        <th colspan="2" class="grp">Liderança</th>
        <th colspan="2" class="grp">Equipe</th>
        <th colspan="2" class="grp">Total</th>
        <th rowspan="2" class="is-num">Dif. meta</th>
      </tr>
      <tr>
        <th class="sub">Meta</th><th class="sub">Real</th>
        <th class="sub">Meta</th><th class="sub">Real</th>
        <th class="sub">Meta</th><th class="sub">Real</th>
      </tr>`;
  } else {
    thead.innerHTML = `
      <tr>
        <th rowspan="2">Loja</th>
        <th colspan="2" class="grp">Liderança</th>
        <th colspan="2" class="grp">Salão</th>
        <th colspan="2" class="grp">Cozinha</th>
        <th colspan="2" class="grp">Total</th>
        <th rowspan="2" class="is-num">Dif. meta</th>
      </tr>
      <tr>
        <th class="sub">Meta</th><th class="sub">Real</th>
        <th class="sub">Meta</th><th class="sub">Real</th>
        <th class="sub">Meta</th><th class="sub">Real</th>
        <th class="sub">Meta</th><th class="sub">Real</th>
      </tr>`;
  }
}

function renderTable(rows, totalMeta, totalReal, mode){
  renderTableHead(mode);
  const tbody = document.getElementById('tableBody');
  function cell(real, meta){
    const cls = real >= meta ? 'real-ok' : 'real-bad';
    return `<td class="is-num">${meta}</td><td class="is-num ${cls}">${real}</td>`;
  }
  const unitLabel = mode === 'lideq' ? 'unidade(s)' : 'lojas';
  let html = '';
  rows.forEach(r=>{
    const grupos = mode === 'lideq'
      ? cell(r.real.lideranca, r.meta.lideranca) + cell(r.real.equipe, r.meta.equipe)
      : cell(r.real.lideranca, r.meta.lideranca) + cell(r.real.salao, r.meta.salao) + cell(r.real.cozinha, r.meta.cozinha);
    html += `<tr>
      <td class="loja">${r.storeKey}</td>
      ${grupos}
      ${cell(r.real.total, r.mTotal)}
      <td class="is-num">${deltaPessoas(r.dif)}</td>
    </tr>`;
  });
  const totalDif = totalReal.total - totalMeta.total;
  const totGrupos = mode === 'lideq'
    ? `<td class="is-num">${totalMeta.lideranca}</td><td class="is-num">${totalReal.lideranca}</td>
       <td class="is-num">${totalMeta.equipe}</td><td class="is-num">${totalReal.equipe}</td>`
    : `<td class="is-num">${totalMeta.lideranca}</td><td class="is-num">${totalReal.lideranca}</td>
       <td class="is-num">${totalMeta.salao}</td><td class="is-num">${totalReal.salao}</td>
       <td class="is-num">${totalMeta.cozinha}</td><td class="is-num">${totalReal.cozinha}</td>`;
  html += `<tr class="total-row">
      <td class="loja">Total (${rows.length} ${unitLabel})</td>
      ${totGrupos}

      <td class="is-num">${deltaPessoas(totalDif)}</td>
    </tr>`;
  tbody.innerHTML = html;
}

function updateChartArea(totalMeta, totalReal, mode){
  const chart = state.charts.area;
  let labels, metaData, realData;
  if(mode === 'lideq'){
    labels = ['Liderança','Equipe'];
    metaData = [totalMeta.lideranca, totalMeta.equipe];
    realData = [totalReal.lideranca, totalReal.equipe];
  } else {
    labels = ['Liderança','Salão e Delivery','Cozinha e Bar'];
    metaData = [totalMeta.lideranca, totalMeta.salao, totalMeta.cozinha];
    realData = [totalReal.lideranca, totalReal.salao, totalReal.cozinha];
    // "Outros": headcount real que existe mas não se encaixa em Liderança/Salão/Cozinha
    // (ex.: Matriz, Burger Franquias — sem essa estrutura). Nunca fica escondido.
    const outrosReal = totalReal.total - (totalReal.lideranca + totalReal.salao + totalReal.cozinha);
    const outrosMeta = totalMeta.total - (totalMeta.lideranca + totalMeta.salao + totalMeta.cozinha);
    if(outrosReal > 0 || outrosMeta > 0){
      labels = [...labels, 'Outros'];
      metaData = [...metaData, outrosMeta];
      realData = [...realData, outrosReal];
    }
  }
  const orcadoData = metaData.map((v,i)=> i===0 ? v : Math.round(v*orcadoFactorFor(mode)));
  chart.data.labels = labels;
  chart.data.datasets[0].data = metaData;
  chart.data.datasets[1].data = orcadoData;
  chart.data.datasets[2].data = realData;
  chart.update();
}

function updateChartPct(totalMeta, totalReal, mode){
  const chart = state.charts.pct;
  let labels, metaVals, realVals;
  if(mode === 'lideq'){
    labels = ['Liderança','Equipe'];
    metaVals = [totalMeta.lideranca, totalMeta.equipe];
    realVals = [totalReal.lideranca, totalReal.equipe];
  } else {
    labels = ['Liderança','Salão e Delivery','Cozinha e Bar'];
    metaVals = [totalMeta.lideranca,totalMeta.salao,totalMeta.cozinha];
    realVals = [totalReal.lideranca,totalReal.salao,totalReal.cozinha];
    const outrosReal = totalReal.total - (totalReal.lideranca + totalReal.salao + totalReal.cozinha);
    const outrosMeta = totalMeta.total - (totalMeta.lideranca + totalMeta.salao + totalMeta.cozinha);
    if(outrosMeta > 0){
      labels = [...labels, 'Outros'];
      metaVals = [...metaVals, outrosMeta];
      realVals = [...realVals, outrosReal];
    }
  }
  const orcadoVals = metaVals.map((v,i)=> i===0 ? v : Math.round(v*orcadoFactorFor(mode)));

  const pctMeta = realVals.map((real,i)=> metaVals[i]>0 ? Math.round((real/metaVals[i])*100) : 0);
  const pctOrcado = realVals.map((real,i)=> orcadoVals[i]>0 ? Math.round((real/orcadoVals[i])*100) : 0);

  chart.data.labels = labels;
  chart.data.datasets[0].data = pctMeta;
  chart.data.datasets[1].data = pctOrcado;

function updateChartLTM(currentMetaTotal){
  const chart = state.charts.ltm;
  const {year, month} = state.selectedMonth;
  const isCC = getCurrentMode() === 'lideq';
  const stores = STORE_KEYS.filter(k=>state.selectedStores.has(k));

  const labels = [];
  const realData = [];
  const metaData = [];
  const orcadoData = [];
  for(let i=11;i>=0;i--){
    const {year:y, month:m} = monthsBack(year, month, i);
    labels.push(fmtMonthShort(y,m));
    let sum = 0;
    let metaSum = 0;
    let liderancaSum = 0;
    if(isCC){
      const counts = getCozinhaCentralCounts(y, m);
      COZINHA_CENTRAL_SUBUNIT_KEYS.forEach(name=>{
        if(!subunitSelected(name)) return;
        sum += counts[name].total;
        const mv = getMetaForSubunitMonth(name, y, m);
        if(mv){ metaSum += mv.lideranca + mv.equipe; liderancaSum += mv.lideranca; }
      });
      sum += counts['Outros'].total;
    } else {
      stores.forEach(k=>{
        sum += getCountsForStoreMonth(k,y,m).total;
        metaSum += metaTotalForMonth(k,y,m);
        const mv = getMetaForStoreMonth(k,y,m);
        if(mv) liderancaSum += mv.lideranca;
      });
    }
    realData.push(sum);
    metaData.push(metaSum);
    orcadoData.push(orcadoTotalFrom(liderancaSum, metaSum - liderancaSum, isCC ? 'lideq' : 'areas'));
  }
  chart.data.labels = labels;
  chart.data.datasets[0].data = realData;
  chart.data.datasets[1].data = metaData;
  chart.data.datasets[2].data = orcadoData;
  chart.update();
}

/* =========================================================
   11.5 GERAR BASE DE ATIVOS (Excel)
   ========================================================= */
function getActiveEmployeesForMonth(stores, year, month){
  const targetKey = year*12 + month;
  const seen = new Set();
  const list = [];
  for(const r of state.records){
    if(!r.storeKey || !stores.includes(r.storeKey)) continue;
    if(!centroCustoAllowed(r)) continue;
    if(isAprendiz(r)) continue;
    if(r.admissao && monthKey(r.admissao) > targetKey) continue;
    if(r.rescisao && monthKey(r.rescisao) <= targetKey) continue;
    const personKey = r.storeKey + '|' + normalize(r.nome);
    if(seen.has(personKey)) continue;
    seen.add(personKey);
    list.push(r);
  }
  // Ordena por loja e depois por nome
  list.sort((a,b)=> a.storeKey===b.storeKey ? a.nome.localeCompare(b.nome) : a.storeKey.localeCompare(b.storeKey));
  return list;
}

function gerarBaseAtivos(){
  const stores = STORE_KEYS.filter(k=>state.selectedStores.has(k));
  if(!stores.length){
    alert('Selecione ao menos uma loja no filtro de Lojas para gerar a base.');
    return;
  }
  const {year, month} = state.selectedMonth;
  const ativos = getActiveEmployeesForMonth(stores, year, month);
  if(!ativos.length){
    alert('Nenhum colaborador ativo encontrado para as lojas selecionadas nessa competência.');
    return;
  }
  const AREA_LABEL = {lideranca:'Liderança', salao:'Salão e Delivery', cozinha:'Cozinha e Bar', outros:'Outros'};
  const data = ativos.map(r=>({
    'Loja': r.storeKey,
    'Nome': r.nome,
    'Cargo': r.cargo || '',
    'Centro de Custo': r.centroCusto || '',
    'Área': AREA_LABEL[classifyArea(r.centroCusto)],
    'Dt Admissão': r.admissao ? fmtDateBR(r.admissao) : '',
  }));
  const ws = XLSX.utils.json_to_sheet(data);
  // Larguras de coluna amigáveis
  ws['!cols'] = [{wch:26},{wch:40},{wch:38},{wch:22},{wch:18},{wch:12}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'Ativos');
  const compName = fmtMonth(year, month).replace('/','-');
  XLSX.writeFile(wb, `BaseAtivos_${compName}.xlsx`);
}

function lineValueLabelPlugin(suffix){
  return {
    id:'lineValueLabels_'+suffix,
    afterDatasetsDraw(chart){
      const {ctx} = chart;
      const T = chartTheme();
      chart.data.datasets.forEach((ds, dsIndex)=>{
        const meta = chart.getDatasetMeta(dsIndex);
        if(meta.type !== 'line') return;
        meta.data.forEach((el, i)=>{
          const val = ds.data[i];
          if(val===undefined || val===null) return;
          ctx.save();
          ctx.font = '500 12px ' + T.font;
          ctx.fillStyle = ds.borderColor;
          ctx.textAlign = 'center';
          ctx.fillText(String(val).replace('.', ',') + (suffix||''), el.x, el.y - 10);
          ctx.restore();
        });
      });
    }
  };
}

function recalcTurnover(){
  const stores = STORE_KEYS.filter(k=>state.selectedStores.has(k));
  const {year, month} = state.selectedMonth;

  const {adm, dem} = getAdmissoesDemissoesMes(stores, year, month);
  const rateMes = turnoverRateMes(stores, year, month);
  const rate12m = turnoverAcumulado(stores, year, month, 12);

  setKpi('kpiTurnoverMes', fmtPct(rateMes));
  setKpi('kpiAdmissoesMes', adm);
  setKpi('kpiDemissoesMes', dem);
  setKpi('kpiTurnover12m', fmtPct(rate12m));

  // Contagem de desconsiderados no mês atual (para o subtítulo dos cards)
  const admList = getAdmissoesListMes(stores, year, month);
  const demList = getDemissoesListMes(stores, year, month);
  const admExcl = admList.filter(i=>i.excluded).length;
  const demExcl = demList.filter(i=>i.excluded).length;
  setKpi('kpiAdmSub', admExcl ? `Entradas no período · ${admExcl} desconsiderada(s)` : 'Entradas no período');
  setKpi('kpiDemSub', demExcl ? `Saídas no período · ${demExcl} desconsiderada(s)` : 'Saídas no período');

  // Últimos 12 meses: admissões x demissões e taxa de turnover
  const labels = [], admData = [], demData = [], rateData = [];
  for(let i=11;i>=0;i--){
    const {year:y, month:m} = monthsBack(year, month, i);
    labels.push(fmtMonthShort(y,m));
    const md = getAdmissoesDemissoesMes(stores,y,m);
    admData.push(md.adm);
    demData.push(md.dem);
    rateData.push(Number(turnoverRateMes(stores,y,m).toFixed(1)));
  }
  const ltm = state.charts.turnoverLTM;
  ltm.data.labels = labels;
  ltm.data.datasets[0].data = admData;
  ltm.data.datasets[1].data = demData;
  ltm.update();
  const rate = state.charts.turnoverRate;
  rate.data.labels = labels;
  rate.data.datasets[0].data = rateData;
  rate.update();

  // Desligamentos na janela de 12 meses (base para os demais gráficos)
  const dismissals = getDismissalsInWindow(stores, year, month, 12);

  // Por tempo de casa (faixa 100% + barras na ordem das faixas)
  const tenureCounts = TENURE_BUCKETS.reduce((acc,b)=>{acc[b]=0; return acc;}, {});
  dismissals.forEach(r=>{ tenureCounts[tenureBucket(tenureMonths(r))]++; });
  const tenureData = TENURE_BUCKETS.map(b=>tenureCounts[b]);
  renderTenureMix(tenureData);
  showBars('tenure', 'barTenure', tenureData.some(v=>v>0) ? TENURE_BUCKETS.map((b,i)=>({label:b, value:tenureData[i]})) : [], {sort:false});

  // Por área
  const areaCounts = {lideranca:0, salao:0, cozinha:0, outros:0};
  dismissals.forEach(r=>{ areaCounts[classifyArea(r.centroCusto)]++; });
  const areaEntries = [
    {label:'Liderança', value:areaCounts.lideranca}, {label:'Salão e Delivery', value:areaCounts.salao},
    {label:'Cozinha e Bar', value:areaCounts.cozinha}, {label:'Outros', value:areaCounts.outros}
  ];
  showBars('demArea', 'barDemArea', areaEntries.some(e=>e.value>0) ? areaEntries : [], {sort:false});

  // Tempo médio de casa dos desligados, mês a mês (LTM)
  const avgLabels = [], avgData = [];
  for(let i=11;i>=0;i--){
    const {year:y, month:m} = monthsBack(year, month, i);
    avgLabels.push(fmtMonthShort(y,m));
    const monthDismissals = getDismissalsInWindow(stores, y, m, 1);
    const tenures = monthDismissals.map(tenureMonths).filter(t=>t!==null);
    const avg = tenures.length ? tenures.reduce((a,b)=>a+b,0)/tenures.length : null;
    avgData.push(avg!==null ? Number(avg.toFixed(1)) : null);
  }
  state.charts.avgTenure.data.labels = avgLabels;
  state.charts.avgTenure.data.datasets[0].data = avgData;
  state.charts.avgTenure.update();

  // Por loja
  const byStoreMap = countByKey(dismissals, r=>r.storeKey);
  const storeEntries = stores
    .map(k=>({label:k, value: byStoreMap.get(k)||0}))
    .filter(e=>e.value>0)
    .sort((a,b)=>b.value-a.value);
  showBars('byStore', 'barByStore', storeEntries);

  // Por cargo (top 8)
  const byCargoMap = countByKey(dismissals, r=> (r.cargo && r.cargo.toString().trim()) || 'Não informado');
  const cargoEntries = Array.from(byCargoMap.entries())
    .map(([label,value])=>({label,value}))
    .sort((a,b)=>b.value-a.value)
    .slice(0,8);
  showBars('byCargo', 'barByCargo', cargoEntries);
}

/* =========================================================
   14.4 DIAGNÓSTICO DO QUADRO
   ========================================================= */
function pctQuadro(storeKey, year, month){
  const mTotal = metaTotalForMonth(storeKey, year, month);
  if(mTotal <= 0) return null;
  const real = getCountsForStoreMonth(storeKey, year, month).total;
  return (real / mTotal) * 100;
}

function hmClass(pct){
  if(pct === null) return 'hm-na';
  if(pct >= 100) return 'hm-100';
  if(pct >= 90) return 'hm-90';
  if(pct >= 75) return 'hm-75';
  return 'hm-low';
}

function getAdmissoesYTDStore(storeKey, year, month){
  const seen = new Set(); let count = 0;
  state.records.forEach(r=>{
    if(r.storeKey !== storeKey) return;
    if(!centroCustoAllowed(r)) return;
    if(isAprendiz(r)) return; // Jovem Aprendiz não entra no turnover
    if(!r.admissao || r.admissao.getFullYear() !== year || r.admissao.getMonth() > month) return;
    const key = admEventKey(r);
    if(seen.has(key) || state.excludedAdm.has(key)) return;
    seen.add(key); count++;
  });
  return count;
}

function recalcDiagnostico(){
  const heatEl = document.getElementById('diagHeatmap');
  if(!heatEl) return;
  const stores = STORE_KEYS.filter(k=>state.selectedStores.has(k));
  const {year, month} = state.selectedMonth;
  const monthsArr = [];
  for(let m=0; m<=month; m++) monthsArr.push(m);

  document.getElementById('diagYearLabel').textContent = year;
  document.getElementById('diagYearLabel2').textContent = '— ' + year;

  // ---- Dados por loja ----
  const storeData = stores.map(storeKey=>{
    const pcts = monthsArr.map(m=>pctQuadro(storeKey, year, m));
    const validPcts = pcts.filter(p=>p!==null);
    const avgPct = validPcts.length ? validPcts.reduce((a,b)=>a+b,0)/validPcts.length : null;
    const currentPct = pcts[pcts.length-1];
    const firstValid = pcts.find(p=>p!==null);
    const trend = (currentPct!==null && firstValid!==undefined && firstValid!==null) ? currentPct - firstValid : null;

    const adm = getAdmissoesYTDStore(storeKey, year, month);
    const demList = getDismissalsInWindow([storeKey], year, month, month+1);
    const dem = demList.length;
    const tenures = demList.map(tenureMonths).filter(t=>t!==null);
    const early = tenures.filter(t=>t<3).length;
    const earlyPct = dem>0 ? (early/dem)*100 : null;

    // meses consecutivos abaixo de 90% (contando de trás pra frente)
    let consecBelow = 0;
    for(let i=pcts.length-1; i>=0; i--){
      if(pcts[i]!==null && pcts[i] < 90) consecBelow++;
      else break;
    }

    const hasAnyData = validPcts.length > 0 || adm > 0 || dem > 0;
    const mTotalCur = metaTotalForMonth(storeKey, year, month);
    const realCur = getCountsForStoreMonth(storeKey, year, month).total;
    return {storeKey, pcts, avgPct, currentPct, trend, adm, dem, earlyPct, early, consecBelow, hasAnyData, mTotalCur, realCur};
  }).filter(s=>s.hasAnyData);

  // ---- KPIs do mês selecionado ----
  const withCurrent = storeData.filter(s=>s.currentPct!==null);
  const fechMedio = withCurrent.length ? withCurrent.reduce((a,s)=>a+s.currentPct,0)/withCurrent.length : 0;
  const naMeta = withCurrent.filter(s=>s.currentPct>=100).length;
  const atencao = withCurrent.filter(s=>s.currentPct>=85 && s.currentPct<100).length;
  const criticas = withCurrent.filter(s=>s.currentPct<85).length;
  document.getElementById('diagFechamento').textContent = fmtPct(fechMedio);
  document.getElementById('diagNaMeta').textContent = `${naMeta} de ${withCurrent.length}`;
  document.getElementById('diagAtencao').textContent = `${atencao} de ${withCurrent.length}`;
  document.getElementById('diagCriticas').textContent = `${criticas} de ${withCurrent.length}`;

  // ---- Mapa de calor (escala divergente do kit; o número fica escrito na célula) ----
  let head = '<thead><tr><th>Loja</th>';
  monthsArr.forEach(m=>{ head += `<th class="grp">${MONTH_ABBR[m]}</th>`; });
  head += '<th class="grp">Média</th></tr></thead>';
  let body = '<tbody>';
  // Padrão: ordena do pior % atual para o melhor (ofensores no topo).
  // Se o usuário acionou a ordenação por Média, usa a coluna Média.
  const sorted = [...storeData].sort((a,b)=>{
    if(state.diagSortDir){
      const am = a.avgPct===null ? (state.diagSortDir==='asc'?999:-1) : a.avgPct;
      const bm = b.avgPct===null ? (state.diagSortDir==='asc'?999:-1) : b.avgPct;
      return state.diagSortDir==='asc' ? am - bm : bm - am;
    }
    const av = a.currentPct===null ? 999 : a.currentPct;
    const bv = b.currentPct===null ? 999 : b.currentPct;
    return av - bv;
  });
  sorted.forEach(s=>{
    body += `<tr><td class="loja">${s.storeKey}</td>`;
    s.pcts.forEach(p=>{
      body += `<td class="hm ${hmClass(p)}">${p===null?'—':Math.round(p)+'%'}</td>`;
    });
    body += `<td class="hm ${hmClass(s.avgPct)}">${s.avgPct===null?'—':Math.round(s.avgPct)+'%'}</td></tr>`;
  });
  body += '</tbody>';
  heatEl.innerHTML = head + body;

  // ---- Pontos de alerta: resumo das 10 piores lojas do ano (InsightList do kit) ----
  const insightsEl = document.getElementById('diagInsights');
  const ranked = storeData
    .filter(s=>s.avgPct !== null)
    .sort((a,b)=>a.avgPct - b.avgPct)
    .slice(0, 10);

  const ICO = {
    negative:'<svg viewBox="0 0 16 16"><path d="M4 5l8 6m0 0V6.5M12 11H7.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    positive:'<svg viewBox="0 0 16 16"><path d="M4 11l8-6m0 0v4.5M12 5H7.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>',
    warning:'<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.5" fill="currentColor"/></svg>'
  };
  if(!ranked.length){
    insightsEl.innerHTML = `<p class="vazio">Sem dados suficientes para gerar o resumo nas lojas filtradas. Ajuste o filtro de lojas ou de centro de custo.</p>`;
  } else {
    insightsEl.innerHTML = '<ul class="cd-ilist">' + ranked.map((s, idx)=>{
      const tone = s.avgPct < 85 ? 'negative' : (s.avgPct < 100 ? 'warning' : 'positive');
      const partes = [];

      // Situação atual
      if(s.currentPct !== null){
        partes.push(`Fechou ${fmtMonth(year, month)} com <strong>${Math.round(s.currentPct)}%</strong> do quadro (${s.realCur} de ${s.mTotalCur} posições).`);
      } else {
        partes.push(`Sem meta definida na competência atual (${s.realCur} pessoa(s) ativa(s)).`);
      }

      // Tendência
      if(s.trend !== null){
        const t = Math.round(s.trend);
        if(t >= 3) partes.push(`Evoluiu <strong>+${t} p.p.</strong> desde o início do ano.`);
        else if(t <= -3) partes.push(`Caiu <strong>${MENOS}${Math.abs(t)} p.p.</strong> desde o início do ano; tendência de piora.`);
        else partes.push(`Desempenho estável ao longo do ano.`);
      }

      // Movimentação
      const saldo = s.adm - s.dem;
      partes.push(`No ano: ${s.adm} admissão(ões) e ${s.dem} demissão(ões), saldo de ${fmtSignedInt(saldo)}.`);

      // Saídas precoces
      if(s.dem >= 3 && s.earlyPct !== null && s.earlyPct >= 30){
        partes.push(`<strong>${Math.round(s.earlyPct)}%</strong> das saídas ocorreram com menos de 3 meses de casa (${s.early} de ${s.dem}). Vale rever seleção e integração.`);
      }

      // Persistência do problema
      if(s.consecBelow >= 2){
        partes.push(`Está há <strong>${s.consecBelow} meses consecutivos</strong> abaixo de 90% do quadro.`);
      }

      return `<li class="cd-ilist-item cd-ilist-${tone}">
        <span class="cd-ilist-ico" aria-hidden="true">${ICO[tone]}</span>
        <div class="cd-ilist-body">
          <div class="cd-ilist-title">${idx+1}. ${s.storeKey} · ${Math.round(s.avgPct)}% médio no ano</div>
          <p class="cd-ilist-text">${partes.join(' ')}</p>
        </div>
      </li>`;
    }).join('') + '</ul>';
  }

  // ---- Tabela de eficiência de gestão ----
  const mgrEl = document.getElementById('diagManagerTable');
  let mgrHead = `<thead><tr>
    <th>Loja</th>
    <th class="is-num">% quadro atual</th>
    <th class="is-num">% médio ${year}</th>
    <th class="is-num">Tendência no ano</th>
    <th class="is-num">Admissões</th>
    <th class="is-num">Demissões</th>
    <th class="is-num">Saldo</th>
    <th class="is-num">% saídas com menos de 3 meses</th>
  </tr></thead>`;
  let mgrBody = '<tbody>';
  const mgrSorted = [...storeData].sort((a,b)=>{
    const av = a.avgPct===null ? 999 : a.avgPct;
    const bv = b.avgPct===null ? 999 : b.avgPct;
    return av - bv;
  });
  mgrSorted.forEach(s=>{
    const saldo = s.adm - s.dem;
    let trendCell = '—';
    if(s.trend !== null){
      const t = Math.round(s.trend);
      if(t > 2) trendCell = deltaHtml(1, `+${t} p.p.`);
      else if(t < -2) trendCell = deltaHtml(-1, `${MENOS}${Math.abs(t)} p.p.`);
      else trendCell = deltaHtml(0, 'estável');
    }
    const earlyCell = s.earlyPct===null ? '—' :
      `<span class="${s.earlyPct>=40?'real-bad':(s.earlyPct<=15?'real-ok':'')}">${Math.round(s.earlyPct)}%</span>`;
    const curCls = s.currentPct!==null && s.currentPct>=100 ? 'real-ok' : (s.currentPct!==null && s.currentPct<85 ? 'real-bad' : '');
    mgrBody += `<tr>
      <td class="loja">${s.storeKey}</td>
      <td class="is-num ${curCls}">${s.currentPct===null?'—':Math.round(s.currentPct)+'%'}</td>
      <td class="is-num">${s.avgPct===null?'—':Math.round(s.avgPct)+'%'}</td>
      <td class="is-num">${trendCell}</td>
      <td class="is-num">${s.adm}</td>
      <td class="is-num">${s.dem}</td>
      <td class="is-num">${deltaPessoas(saldo)}</td>
      <td class="is-num">${earlyCell}</td>
    </tr>`;
  });
  mgrBody += '</tbody>';
  mgrEl.innerHTML = mgrHead + mgrBody;
}

function updateDiagSortLabel(){
  const btn = document.getElementById('btnSortMedia');
  if(!btn) return;
  let t = 'Ordenar por média';
  if(state.diagSortDir === 'asc') t = 'Média: menor → maior';
  else if(state.diagSortDir === 'desc') t = 'Média: maior → menor';
  btn.innerHTML = `<span>${t}</span>`;
}

// Exporta um painel do diagnóstico como PNG, expandindo tabelas com rolagem para captura completa
async function exportDiagCard(cardId, btnId, title, filePrefix){
  const btn = document.getElementById(btnId);
  const card = document.getElementById(cardId);
  if(!btn || !card) return;
  const originalLabel = btn.innerHTML;
  btn.innerHTML = '<span>Gerando…</span>';
  btn.disabled = true;

  // Esconde os botões de ação durante a captura
  const actions = card.querySelectorAll('.cd-panel-actions');
  actions.forEach(a=>a.style.visibility='hidden');

  // Expande a área de rolagem para capturar a tabela inteira
  const scrollEl = card.querySelector('.cd-table-wrap');
  const table = scrollEl ? scrollEl.querySelector('table') : null;
  const prevOverflow = scrollEl ? scrollEl.style.overflow : '';
  const prevCardWidth = card.style.width;
  if(scrollEl && table){
    scrollEl.style.overflow = 'visible';
    const needed = table.scrollWidth + 48; // respiro do painel
    if(needed > card.offsetWidth) card.style.width = needed + 'px';
  }

  // Cabeçalho temporário no verde da marca
  const hdr = document.createElement('div');
  hdr.className = 'export-header show';
  hdr.innerHTML = `
    <p class="t1">${title}</p>
    <p class="t2">${fmtMonth(state.selectedMonth.year, state.selectedMonth.month)} · gerado em ${fmtDateBR(new Date())} · Headcount e turnover · Cabana</p>`;
  card.prepend(hdr);

  try{
    await new Promise(r=>setTimeout(r, 80));
    const canvas = await html2canvas(card, {scale:2, backgroundColor:tok('--dado-bg')});
    const now = new Date();
    const dd = String(now.getDate()).padStart(2,'0');
    const mm = String(now.getMonth()+1).padStart(2,'0');
    const link = document.createElement('a');
    link.download = `${filePrefix}_${dd}-${mm}-${now.getFullYear()}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
  }catch(err){
    console.error(err);
    alert('Não foi possível gerar a imagem.');
  }finally{
    hdr.remove();
    if(scrollEl){ scrollEl.style.overflow = prevOverflow; }
    card.style.width = prevCardWidth;
    actions.forEach(a=>a.style.visibility='');
    btn.innerHTML = originalLabel;
    btn.disabled = false;
  }
}

/* =========================================================
   14.5 AJUSTE DE ADMISSÕES/DEMISSÕES (DetailDrawer do kit)
   Só muda o cálculo do turnover nesta sessão; a base não é alterada.
   ========================================================= */
function openAdjustModal(type){
  const stores = STORE_KEYS.filter(k=>state.selectedStores.has(k));
  const {year, month} = state.selectedMonth;
  const isAdm = type === 'adm';
  const list = isAdm ? getAdmissoesListMes(stores, year, month) : getDemissoesListMes(stores, year, month);
  const exclSet = isAdm ? state.excludedAdm : state.excludedDem;
  const titulo = isAdm ? 'Admissões' : 'Demissões';
  const compLabel = fmtMonth(year, month);

  const drawer = CabanaData.DetailDrawer();
  drawer.open({
    title: `${titulo} em ${compLabel}`,
    subtitle: 'Desmarque quem não deve entrar no cálculo do turnover. A base não é alterada.',
    render(body){
      body.innerHTML = `
        <div class="adj-toolbar">
          <div class="acoes">
            <button type="button" class="f-link" data-action="all">Marcar todos</button>
            <button type="button" class="f-link" data-action="none">Desmarcar todos</button>
          </div>
          <span class="adj-count"></span>
        </div>
        <div class="adj-list"></div>
        <div class="adj-foot"><button type="button" class="f-btn f-btn-primary adj-done">Concluir</button></div>`;
      const listEl = body.querySelector('.adj-list');
      const countEl = body.querySelector('.adj-count');

      function refreshCount(){
        const total = list.length;
        const considered = list.filter(i=>!exclSet.has(i.key)).length;
        countEl.textContent = `${considered} de ${total} considerado(s) no turnover`;
      }
      function update(){ recalcTurnover(); recalcDiagnostico(); }

      function renderList(){
        if(!list.length){
          listEl.innerHTML = `<p class="vazio">Nenhum evento de ${titulo.toLowerCase()} nas lojas filtradas nessa competência.</p>`;
          refreshCount();
          return;
        }
        listEl.innerHTML = list.map(item=>{
          const dt = isAdm ? item.r.admissao : item.r.rescisao;
          const checked = !exclSet.has(item.key);
          return `
            <label class="adj-item ${checked?'':'excluded'}" data-key="${item.key}">
              <input type="checkbox" ${checked?'checked':''}/>
              <div>
                <div class="nome">${item.r.nome}</div>
                <div class="det">${item.r.storeKey} · ${item.r.cargo || 'Cargo não informado'} · ${fmtDateBR(dt)}</div>
              </div>
            </label>`;
        }).join('');
        refreshCount();
        listEl.querySelectorAll('.adj-item').forEach(el=>{
          const cb = el.querySelector('input');
          cb.addEventListener('change', ()=>{
            const key = el.dataset.key;
            if(cb.checked) exclSet.delete(key); else exclSet.add(key);
            el.classList.toggle('excluded', !cb.checked);
            refreshCount();
            update(); // atualiza KPIs e gráficos em tempo real
          });
        });
      }

      body.querySelector('[data-action=all]').onclick = ()=>{ list.forEach(i=>exclSet.delete(i.key)); renderList(); update(); };
      body.querySelector('[data-action=none]').onclick = ()=>{ list.forEach(i=>exclSet.add(i.key)); renderList(); update(); };
      body.querySelector('.adj-done').onclick = ()=>drawer.close();
      renderList();
    }
  });
}

/* =========================================================
   16. BOOTSTRAP
   ========================================================= */
// Caminhos onde o arquivo da base fica no GitHub Pages. Um robô Python (rodando
// via GitHub Actions) mantém data/dados.xlsx sincronizado a partir do OneDrive —
// o painel só precisa saber procurar aqui, sem se preocupar com OneDrive/CORS.
// Atenção: GitHub Pages diferencia maiúsculas/minúsculas no caminho!
const SERVER_DATA_PATHS = ['./data/dados.xlsx', './dados.xlsx', './Data/dados.xlsx', './data/Dados.xlsx'];

function isValidXlsxBuffer(buf){
  // valida assinatura de arquivo xlsx (ZIP começa com "PK")
  const bytes = new Uint8Array(buf.slice(0,2));
  return bytes[0]===0x50 && bytes[1]===0x4B;
}

async function fetchServerBase(){
  for(const path of SERVER_DATA_PATHS){
    try{
      const resp = await fetch(path, {cache:'no-store'});
      if(!resp.ok) continue;
      const buf = await resp.arrayBuffer();
      if(!isValidXlsxBuffer(buf)) continue;
      const lastModHeader = resp.headers.get('Last-Modified');
      const lastMod = lastModHeader ? new Date(lastModHeader) : null;
      return {buf, lastMod, path};
    }catch(e){ /* tenta o próximo caminho */ }
  }
  return null;
}

async function loadFromServer(){
  const found = await fetchServerBase();
  if(!found) return false;
  const records = parseWorkbook(found.buf);
  if(!records.length) return false;
  state.records = records;
  state.source = 'server';
  state.importedAt = new Date();
  state.dataUpdatedAt = found.lastMod || new Date();
  await idbSet('main', {records, importedAt:state.importedAt, source:state.source, dataUpdatedAt:state.dataUpdatedAt});
  setupAfterLoad();
  return true;
}

function setupAfterLoad(){
  state.availableMonths = computeAvailableMonths(state.records);
  state.selectedMonth = state.availableMonths[0] || {year:new Date().getFullYear(), month:new Date().getMonth()};
  state.selectedStores = new Set(DEFAULT_STORE_KEYS);
  state.selectedCentrosCusto = new Set(getCentroCustoOptions());
  state.excludedAdm = new Set();
  state.excludedDem = new Set();
  document.getElementById('stateBox').innerHTML = '';
  renderStatusBar();
  renderDashboardShell();
  recalcAll();
}

async function init(){
  try{
    if(await loadFromServer()) return;
  }catch(e){ /* segue para IndexedDB */ }

  try{
    const saved = await idbGet('main');
    if(saved && saved.records && saved.records.length){
      state.records = saved.records;
      state.source = 'cache';
      state.importedAt = saved.importedAt ? new Date(saved.importedAt) : new Date();
      state.dataUpdatedAt = saved.dataUpdatedAt ? new Date(saved.dataUpdatedAt) : state.importedAt;
      setupAfterLoad();
      return;
    }
  }catch(e){ console.warn('IndexedDB indisponível', e); }

  showBaseUnavailable();
}

document.addEventListener('DOMContentLoaded', ()=>{
  CabanaData.theme.root = document.getElementById('root'); // tema claro fixo, sem alternância
  init();
});
