@media (prefers-reduced-motion: reduce) {
  .cb *, .cb *::before, .cb *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; animation-delay: 0ms !important; transition-duration: 1ms !important; }
  .cb-press:active { transform: none; }
}
@media (prefers-reduced-transparency: reduce) {
  .cb-bp, .cb-abas, .cb-bi-vidro { background: var(--superficie); -webkit-backdrop-filter: none; backdrop-filter: none; }
}

/* Folha: arraste e saída */
.cb-folha.cb-arrastando { animation: none; transition: none; }
.cb-folha.cb-saindo { animation: cb-folha-sai var(--dur-base) var(--curva-saida) both; }
.cb-veu.cb-saindo { animation: cb-fade-sai var(--dur-base) var(--curva-saida) both; }
.cb-folha.cb-voltando { transition: transform var(--dur-mola-arrasto) var(--curva-mola-arrasto); }
.cb-folha-alca { cursor: grab; touch-action: none; }
@keyframes cb-folha-sai { from { transform: translateY(var(--cb-y, 0px)); } to { transform: translateY(100%); } }
@keyframes cb-fade-sai { from { opacity: 1; } to { opacity: 0; } }
.cb-aviso.cb-saindo { animation: cb-aviso-sai var(--dur-rapida) var(--curva-saida) both; }
@keyframes cb-aviso-sai { to { transform: translateY(-12px) scale(0.98); opacity: 0; } }

/* Voo do item até o pedido */
.cb-voo { position: fixed; z-index: var(--z-aviso); pointer-events: none; border-radius: var(--raio-controle); overflow: hidden; background: var(--superficie-2); box-shadow: var(--sombra-2); }
.cb-voo img { width: 100%; height: 100%; object-fit: cover; mix-blend-mode: multiply; }

/* Barra de navegação com título grande */
.cb-nav { position: sticky; top: 0; z-index: var(--z-barra); }
.cb-nav-barra { height: var(--barra-superior); display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 0 var(--espaco-2); transition: background-color var(--dur-rapida), box-shadow var(--dur-rapida); }
.cb-nav.cb-rolou .cb-nav-barra { background: var(--vidro); -webkit-backdrop-filter: var(--vidro-desfoque); backdrop-filter: var(--vidro-desfoque); box-shadow: 0 0.5px 0 var(--separador); }
.cb-nav-mini { font-size: 1.0625rem; font-weight: 600; opacity: 0; transform: translateY(4px); transition: opacity var(--dur-rapida), transform var(--dur-rapida) var(--curva-padrao); white-space: nowrap; }
.cb-nav.cb-rolou .cb-nav-mini { opacity: 1; transform: none; }
.cb-nav-esq { justify-self: start; display: flex; } .cb-nav-dir { justify-self: end; display: flex; }
.cb-nav-grande { margin: 0; padding: 2px var(--espaco-4) var(--espaco-2); font-size: 2.125rem; line-height: 2.5625rem; font-weight: 700; letter-spacing: -0.01em; transform-origin: left center; transition: opacity var(--dur-rapida), transform var(--dur-rapida); }
.cb-nav.cb-rolou .cb-nav-grande { opacity: 0; transform: scale(0.96); }
.cb-voltar { display: inline-flex; align-items: center; gap: 2px; height: var(--toque-minimo); padding: 0 var(--espaco-2) 0 0; border: 0; background: none; color: var(--acao-texto); font-size: 1.0625rem; cursor: pointer; }

/* Busca */
.cb-busca { position: relative; display: flex; align-items: center; height: var(--ctl-medio); border-radius: var(--raio-controle); background: var(--controle); color: var(--texto-secundario); padding: 0 var(--espaco-2); gap: 6px; }
.cb-busca input { flex: 1; min-width: 0; height: 100%; border: 0; background: none; outline: none; font: 400 1rem var(--font-sans); color: var(--texto); }
.cb-busca input::placeholder { color: var(--texto-secundario); }
.cb-busca:focus-within { box-shadow: inset 0 0 0 1.5px var(--foco); }
.cb-busca-limpar { width: 28px; height: 28px; border: 0; border-radius: 50%; background: var(--texto-terciario); color: var(--superficie); display: flex; align-items: center; justify-content: center; cursor: pointer; position: relative; }
.cb-busca-limpar::after { content: ""; position: absolute; inset: -8px; }

/* Alerta (confirmação) */
.cb-alerta-veu { position: absolute; inset: 0; background: var(--veu); z-index: var(--z-sistema); display: flex; align-items: center; justify-content: center; padding: var(--espaco-10); animation: cb-fade var(--dur-rapida) var(--curva-padrao) both; }
.cb-alerta { width: 100%; max-width: 300px; border-radius: var(--raio-flutuante); background: var(--superficie); box-shadow: var(--sombra-3); padding: var(--espaco-5); display: flex; flex-direction: column; gap: var(--espaco-2); text-align: center; animation: cb-alerta var(--dur-mola-firme) var(--curva-mola-firme) both; }
.cb-alerta-titulo { font-size: 1.0625rem; line-height: 1.375rem; font-weight: 700; }
.cb-alerta-txt { font-size: 0.9375rem; line-height: 1.25rem; color: var(--texto-secundario); margin-bottom: var(--espaco-2); }
@keyframes cb-alerta { from { transform: scale(1.12); opacity: 0; } to { transform: none; opacity: 1; } }

/* Imagem de produto com carregamento progressivo */
.cb-img { position: relative; overflow: hidden; background: var(--superficie-2); border-radius: var(--raio-cartao); }
.cb-img img { width: 100%; height: 100%; object-fit: cover; mix-blend-mode: multiply; opacity: 0; transform: scale(1.02); transition: opacity var(--dur-lenta) var(--curva-padrao), transform var(--dur-lenta) var(--curva-padrao); display: block; }
[data-theme="escuro"] .cb-img img { mix-blend-mode: normal; }
.cb-img.cb-carregou img { opacity: 1; transform: none; }
.cb-img .cb-esq { position: absolute; inset: 0; border-radius: 0; transition: opacity var(--dur-rapida); }
.cb-img.cb-carregou .cb-esq { opacity: 0; }
.cb-img-falha { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; color: var(--texto-secundario); font-size: 0.8125rem; }

/* Texto grande (Dynamic Type até 200%): nada corta, tudo quebra */
.cb-aviso { flex-wrap: wrap; }
.cb-card, .cb-mesa, .cb-etapa, .cb-op-txt, .cb-lp-txt, .cb-item-txt { min-width: 0; overflow-wrap: anywhere; }
.cb-card-rodape, .cb-etapas-lista { flex-wrap: wrap; }
.cb-etapas-lista { gap: 2px var(--espaco-2); }
/* Grade de produtos: 2 colunas no celular, 3–4 na web, 1 coluna com texto muito grande (mínimo em rem) */
.cb-grade-produtos { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(9.5rem, 100%), 1fr)); gap: var(--espaco-4) var(--espaco-3); }

/* ===== Dashboards (ex-Cabana Data), classes cd-*, tokens dado-* ===== */
/* Cabana Data — component styles. Every color, radius, space and motion value comes from tokens.css. */

.cd-root, .cd-kpi, .cd-panel, .cd-chart, .cd-bars, .cd-table, .cd-seg, .cd-app, .cd-insight, .cd-mix, .cd-heat {
  font-family: var(--font-sans);
  font-feature-settings: "tnum" 1, "lnum" 1;
  -webkit-font-smoothing: antialiased;
  color: var(--dado-ink);
}
.cd-root { background: var(--dado-bg); min-height: 100%; }

/* ---------- focus ---------- */
.cd-seg-btn:focus-visible, .cd-switch-track:focus-visible, .cd-theme:focus-visible, .cd-th-btn:focus-visible {
  outline: 2px solid var(--dado-focus-ring);
  outline-offset: 2px;
}

/* ---------- ThemeToggle ---------- */
.cd-theme {
  position: relative; display: inline-flex; align-items: center; justify-content: space-between;
  width: 60px; height: 32px; padding: 0 9px; border-radius: var(--dado-radius-full);
  border: 1px solid var(--dado-border); background: var(--dado-surface-sunken); color: var(--dado-ink-subtle);
  cursor: pointer; transition: background var(--dado-duration-base) var(--dado-easing-standard), border-color var(--dado-duration-base) var(--dado-easing-standard);
}
@media (hover: hover) and (pointer: fine){.cd-theme:hover{ border-color: var(--dado-border-strong); }}
.cd-theme-ico { position: relative; z-index: 1; width: 14px; height: 14px; display: block; transition: color var(--dado-duration-base) var(--dado-easing-standard), transform var(--dado-duration-moderate) var(--dado-easing-enter); }
.cd-theme-ico svg { display: block; width: 14px; height: 14px; }
.cd-theme-thumb {
  position: absolute; top: 3px; left: 3px; width: 24px; height: 24px; border-radius: var(--dado-radius-full);
  background: var(--dado-surface-raised); box-shadow: var(--dado-shadow-thumb);
  transition: transform var(--dado-duration-base) var(--dado-easing-spring);
}
.cd-theme[aria-checked="false"] .cd-theme-sun { color: var(--dado-brand); }
.cd-theme[aria-checked="true"] .cd-theme-thumb { transform: translateX(28px); }
.cd-theme[aria-checked="true"] .cd-theme-moon { color: var(--dado-brand); transform: rotate(-20deg); }

/* ---------- SegmentedControl ---------- */
.cd-seg {
  position: relative; display: inline-flex; padding: 2px; gap: 0;
  height: var(--dado-control-h); box-sizing: border-box;
  background: var(--dado-surface-sunken); border: 1px solid var(--dado-border); border-radius: var(--dado-radius-sm);
}
.cd-seg-pill {
  position: absolute; top: 2px; bottom: 2px; left: 2px; width: 0;
  background: var(--dado-surface-raised); border-radius: var(--dado-radius-xs); box-shadow: var(--dado-shadow-thumb);
  transition: transform var(--dado-duration-base) var(--dado-easing-spring), width var(--dado-duration-base) var(--dado-easing-spring);
}
.cd-seg-btn {
  position: relative; z-index: 1; border: 0; background: none; cursor: pointer;
  padding: 0 var(--dado-space-3); font: 500 13px/18px var(--font-sans); color: var(--dado-ink-muted);
  border-radius: var(--dado-radius-xs); white-space: nowrap;
  transition: color var(--dado-duration-fast) var(--dado-easing-standard);
}
@media (hover: hover) and (pointer: fine){.cd-seg-btn:hover{ color: var(--dado-ink); }}
.cd-seg-btn[aria-checked="true"] { color: var(--dado-ink); }
.cd-seg-sm { height: 28px; }
.cd-seg-sm .cd-seg-btn { font-size: 12px; padding: 0 var(--dado-space-2); }

/* ---------- Switch ---------- */
.cd-switch { display: inline-flex; align-items: center; gap: var(--dado-space-2); cursor: pointer; font: 400 13px/18px var(--font-sans); color: var(--dado-ink-muted); }
.cd-switch-track {
  position: relative; width: 36px; height: 20px; padding: 0; border-radius: var(--dado-radius-full);
  border: 1px solid var(--dado-border-strong); background: var(--dado-surface-sunken); cursor: pointer;
  transition: background var(--dado-duration-base) var(--dado-easing-standard), border-color var(--dado-duration-base) var(--dado-easing-standard);
}
.cd-switch-thumb {
  position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: var(--dado-radius-full);
  background: var(--dado-ink-subtle); box-shadow: var(--dado-shadow-thumb);
  transition: transform var(--dado-duration-base) var(--dado-easing-spring), background var(--dado-duration-base) var(--dado-easing-standard);
}
.cd-switch-track[aria-checked="true"] { background: var(--dado-brand); border-color: var(--dado-brand); }
.cd-switch-track[aria-checked="true"] .cd-switch-thumb { transform: translateX(16px); background: var(--dado-ink-inverse); }
.cd-switch-track:active .cd-switch-thumb { width: 17px; }
.cd-switch-track[aria-checked="true"]:active .cd-switch-thumb { transform: translateX(13px); }

/* ---------- Delta & Badge ---------- */
.cd-delta {
  display: inline-flex; align-items: center; gap: 3px; height: 20px; padding: 0 6px;
  border-radius: var(--dado-radius-sm); font: 600 12px/16px var(--font-sans); font-feature-settings: "tnum" 1; white-space: nowrap;
}
.cd-delta-arrow { display: inline-flex; width: 8px; height: 8px; }
.cd-delta-arrow svg { width: 8px; height: 8px; display: block; }
.cd-delta-positive { color: var(--dado-positive); background: var(--dado-positive-soft); }
.cd-delta-negative { color: var(--dado-negative); background: var(--dado-negative-soft); }
.cd-delta-neutral { color: var(--dado-ink-muted); background: var(--dado-neutral-soft); }
.cd-delta-plain { background: none; padding: 0; height: auto; }

.cd-badge {
  display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px;
  border-radius: var(--dado-radius-sm); font: 500 12px/16px var(--font-sans); white-space: nowrap;
}
.cd-badge-dot { width: 6px; height: 6px; border-radius: var(--dado-radius-full); background: currentColor; }
.cd-badge-neutral { background: var(--dado-neutral-soft); color: var(--dado-ink-muted); }
.cd-badge-positive { background: var(--dado-positive-soft); color: var(--dado-positive); }
.cd-badge-negative { background: var(--dado-negative-soft); color: var(--dado-negative); }
.cd-badge-warning { background: var(--dado-warning-soft); color: var(--dado-warning); }
.cd-badge-brand { background: var(--dado-brand-soft); color: var(--dado-brand); }
.cd-badge-accent { background: var(--dado-accent-soft); color: var(--dado-accent-ink); }

/* ---------- rolling digits ---------- */
.cd-roll { position: relative; display: inline-block; overflow: hidden; vertical-align: top; height: 1.1em; line-height: 1.1em; }
.cd-roll-new { display: inline-block; animation: cd-roll-in var(--dado-duration-roll) var(--dado-easing-enter) var(--d, 0ms) both; }
.cd-roll-old { position: absolute; left: 0; top: 0; animation: cd-roll-out var(--dado-duration-roll) var(--dado-easing-standard) var(--d, 0ms) both; }
.cd-roll.is-down .cd-roll-new { animation-name: cd-roll-in-down; }
.cd-roll.is-down .cd-roll-old { animation-name: cd-roll-out-down; }
@keyframes cd-roll-in { from { transform: translateY(100%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes cd-roll-out { from { transform: none; opacity: 1; } to { transform: translateY(-100%); opacity: 0; } }
@keyframes cd-roll-in-down { from { transform: translateY(-100%); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes cd-roll-out-down { from { transform: none; opacity: 1; } to { transform: translateY(100%); opacity: 0; } }

/* ---------- KpiCard ---------- */
.cd-kpi {
  display: flex; flex-direction: column; gap: var(--dado-space-2);
  padding: var(--dado-space-5); background: var(--dado-surface); border: 1px solid var(--dado-border); border-radius: var(--dado-radius-md);
  min-width: 0;
}
.cd-kpi-flat { border: 0; padding: 0; background: none; }
.cd-kpi-top { display: flex; align-items: center; justify-content: space-between; gap: var(--dado-space-2); min-height: 22px; }
.cd-kpi-label { font: 500 13px/18px var(--font-sans); color: var(--dado-ink-muted); }
.cd-kpi-row { display: flex; align-items: flex-end; justify-content: space-between; gap: var(--dado-space-3); }
.cd-kpi-value { font: 600 32px/36px var(--font-sans); letter-spacing: -0.02em; font-feature-settings: "tnum" 1; color: var(--dado-ink); white-space: nowrap; }
.cd-kpi-xl .cd-kpi-value { font-size: 48px; line-height: 52px; letter-spacing: -0.025em; }
.cd-kpi-empty { color: var(--dado-ink-subtle); }
.cd-kpi-foot { display: flex; align-items: center; flex-wrap: wrap; gap: var(--dado-space-2); min-height: 20px; }
.cd-kpi-comp { font: 400 13px/18px var(--font-sans); color: var(--dado-ink-subtle); }

.cd-spark { flex: none; overflow: visible; }
.cd-spark-line { stroke: var(--dado-brand); stroke-width: 1.5; stroke-linejoin: round; stroke-linecap: round; }
.cd-spark-area { fill: var(--dado-brand-soft); }
.cd-spark-dot { fill: var(--dado-brand); }

/* ---------- Panel ---------- */
.cd-panel { background: var(--dado-surface); box-shadow: 0 0 0 1px var(--dado-border); border-radius: var(--dado-radius-md); padding: var(--dado-space-6); display: flex; flex-direction: column; gap: var(--dado-space-4); min-width: 0; }
.cd-panel-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--dado-space-4); }
.cd-panel-titles { min-width: 0; }
.cd-panel-title { margin: 0; font: 600 15px/20px var(--font-sans); color: var(--dado-ink); }
.cd-panel-sub { margin: 2px 0 0; font: 400 13px/18px var(--font-sans); color: var(--dado-ink-muted); }
.cd-panel-actions { display: flex; align-items: center; gap: var(--dado-space-2); flex: none; }
.cd-panel-body { min-width: 0; }
.cd-panel-foot { font: 400 12px/16px var(--font-sans); color: var(--dado-ink-subtle); padding-top: var(--dado-space-3); border-top: 1px solid var(--dado-border); }

/* ---------- charts (shared) ---------- */
.cd-chart { position: relative; width: 100%; }
.cd-chart svg { display: block; overflow: visible; }
.cd-grid { stroke: var(--dado-border); stroke-width: 1; shape-rendering: crispEdges; }
.cd-axis-zero { stroke: var(--dado-border-strong); stroke-width: 1; shape-rendering: crispEdges; }
.cd-tick { font: 400 11px/14px var(--font-sans); font-feature-settings: "tnum" 1; fill: var(--dado-ink-subtle); }
.cd-line { stroke: var(--c, var(--dado-series-1)); stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.cd-line-prev { stroke: var(--dado-series-prev); stroke-width: 1.5; stroke-dasharray: 4 4; }
.cd-area { fill: var(--dado-brand-soft); opacity: 0.9; }
.cd-target { stroke: var(--dado-target); stroke-width: 1; stroke-dasharray: 2 3; }
.cd-target-label { font: 600 11px/14px var(--font-sans); fill: var(--dado-target); }
.cd-cross { stroke: var(--dado-border-strong); stroke-width: 1; opacity: 0; transition: opacity var(--dado-duration-fast) var(--dado-easing-standard); }
.cd-dot { fill: var(--dado-surface); stroke: var(--c, var(--dado-series-1)); stroke-width: 2; opacity: 0; transition: opacity var(--dado-duration-fast) var(--dado-easing-standard); }
svg.is-hover .cd-cross, svg.is-hover .cd-dot { opacity: 1; }

.cd-legend { display: flex; flex-wrap: wrap; gap: var(--dado-space-2) var(--dado-space-4); margin-bottom: var(--dado-space-3); font: 400 12px/16px var(--font-sans); color: var(--dado-ink-muted); }
.cd-legend-item { display: inline-flex; align-items: center; gap: 6px; }
.cd-legend-sw { width: 10px; height: 10px; border-radius: 2px; background: var(--sw); flex: none; }
.cd-legend-sw.is-dashed { height: 0; width: 14px; border-radius: 0; background: none; border-top: 2px dashed var(--sw); }

.cd-tip {
  position: absolute; left: 0; top: 0; z-index: 5; pointer-events: none; min-width: 140px;
  padding: var(--dado-space-2) var(--dado-space-3); background: var(--dado-surface-raised); color: var(--dado-ink);
  border: 1px solid var(--dado-border); border-radius: var(--dado-radius-sm); box-shadow: var(--dado-shadow-overlay);
  font: 400 12px/16px var(--font-sans); font-feature-settings: "tnum" 1;
  opacity: 0; transition: opacity var(--dado-duration-fast) var(--dado-easing-exit), transform var(--dado-duration-fast) var(--dado-easing-standard);
}
.cd-tip.is-on { opacity: 1; transition-timing-function: var(--dado-easing-enter), var(--dado-easing-standard); }
.cd-tip-title { font-weight: 600; margin-bottom: 4px; color: var(--dado-ink); }
.cd-tip-row { display: flex; align-items: center; gap: var(--dado-space-2); padding: 1px 0; }
.cd-tip-sw { width: 8px; height: 8px; border-radius: 2px; background: var(--sw); flex: none; }
.cd-tip-sw-dash { height: 0; border-top: 2px dashed var(--sw); background: none; border-radius: 0; }
.cd-tip-name { color: var(--dado-ink-muted); flex: 1; }
.cd-tip-val { font-weight: 600; }

/* ---------- BarChart ---------- */
.cd-bars { display: flex; flex-direction: column; gap: 2px; }
.cd-bar-row {
  display: grid; grid-template-columns: minmax(88px, 160px) 1fr auto auto; align-items: center; gap: var(--dado-space-3);
  height: 30px; padding: 0 var(--dado-space-2); margin: 0 calc(-1 * var(--dado-space-2)); border-radius: var(--dado-radius-sm);
  transition: background var(--dado-duration-fast) var(--dado-easing-standard), transform var(--dado-duration-reorder) var(--dado-easing-standard);
}
@media (hover: hover) and (pointer: fine){.cd-bar-row:hover{ background: var(--dado-surface-sunken); }}
.cd-bar-label { font: 400 13px/18px var(--font-sans); color: var(--dado-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cd-bar-track { position: relative; height: 12px; }
.cd-bar { height: 100%; width: 0; background: var(--dado-series-1); border-radius: 0 var(--dado-radius-xs) var(--dado-radius-xs) 0; transition: background var(--dado-duration-base) var(--dado-easing-standard); }
.cd-bar.is-neg { background: var(--dado-negative); }
.cd-bar-row.is-hl .cd-bar { background: var(--dado-accent); }
.cd-bar-row.is-hl .cd-bar-label { font-weight: 600; }
.cd-bar-target { position: absolute; top: -4px; bottom: -4px; width: 0; border-left: 1.5px dashed var(--dado-target); }
.cd-bar-val { font: 600 13px/18px var(--font-sans); font-feature-settings: "tnum" 1; text-align: right; min-width: 72px; white-space: nowrap; }
.cd-bar-delta { min-width: 56px; text-align: right; }
.cd-bar-delta:empty { display: none; }

/* ---------- MixBar ---------- */
.cd-mix-bar { display: flex; gap: 2px; height: 14px; border-radius: var(--dado-radius-xs); overflow: hidden; background: var(--dado-surface-sunken); }
.cd-mix-seg { height: 100%; min-width: 0; }
.cd-mix-legend { display: flex; flex-wrap: wrap; gap: var(--dado-space-2) var(--dado-space-6); margin-top: var(--dado-space-4); }
.cd-mix-item { display: flex; align-items: center; gap: var(--dado-space-2); font: 400 13px/18px var(--font-sans); }
.cd-mix-name { color: var(--dado-ink-muted); }
.cd-mix-pct { font-weight: 600; font-feature-settings: "tnum" 1; }
.cd-mix-val { color: var(--dado-ink-subtle); font-feature-settings: "tnum" 1; }

/* ---------- Heatmap ---------- */
.cd-heat { position: relative; }

/* área de conteúdo: centro óptico ~46% da altura útil */
.cs-topo{flex:none}
.cs-corpo{flex:1;min-height:0;display:flex;flex-direction:column;justify-content:center;padding-bottom:var(--slide-respiro-base)}
.cs-centro{flex:1;display:flex;flex-direction:column;justify-content:center;padding-bottom:var(--slide-respiro-base)}
.cs-centro.cs-meio{align-items:center;text-align:center}
.cs-grade{display:grid;gap:var(--slide-goteira);align-items:stretch}
.cs-grade>.cs-cartao{height:100%;justify-content:flex-start}.cs-cartao>:last-child:not(:first-child){margin-bottom:0}
.cs-g2{grid-template-columns:repeat(2,minmax(0,1fr))}.cs-g3{grid-template-columns:repeat(3,minmax(0,1fr))}.cs-g4{grid-template-columns:repeat(4,minmax(0,1fr))}

.cs-cartao{background:var(--slide-fundo);border-radius:var(--raio-slide-cartao);padding:48px;box-shadow:var(--sombra-slide-1);display:flex;flex-direction:column;gap:16px}

.cs-tabela{width:100%;border-collapse:collapse;font-size:24px;line-height:32px}

.cs-moldura{border-radius:var(--raio-slide-moldura);overflow:hidden;box-shadow:var(--sombra-slide-2);background:var(--slide-fundo)}
.cs-celular{width:390px;height:844px;border-radius:56px;overflow:hidden;box-shadow:var(--sombra-slide-2),0 0 0 10px var(--slide-tinta);background:var(--slide-fundo)}

/* movimento: construção dos elementos; --i = ordem */
@keyframes cs-sobe{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.cs-entra{animation:cs-sobe var(--dur-lenta) var(--curva-entrada) both;animation-delay:calc(var(--i,0) * var(--slide-escalonamento))}

/* ---- Loja (fun) ---- */
.cs-loja .cs-titulo,.cs-loja .cs-titulo-capa,.cs-loja .cs-titulo-abertura{text-transform:uppercase;letter-spacing:-.02em;line-height:.88}
.cs-loja .cs-titulo{font-size:88px}
.cs-fecho{font-family:var(--font-loja);font-weight:700;font-synthesis:none;text-transform:none;letter-spacing:-.02em;display:block;color:var(--laranja-burger);font-size:1.1em;line-height:.95}
.cs-chapado .cs-fecho{color:var(--verde-limonada)}

.cs-foto img{width:100%;height:100%;object-fit:cover;display:block}
/* 4.18 · fundo do deck: branco (padrão) ou Bege Maionese do manual, escolhido na criação do deck. Abertura e capa de loja seguem verdes. */
.cs-palco.cs-bege:not(.cs-chapado){background:var(--bege-maionese)}
.cs-palco.cs-bege:not(.cs-chapado) .cs-fecho{color:var(--verde-cabana)} /* laranja sobre bege fica em 2,8:1 */
/* 4.17 · slide de referências: fotos inteiras, na proporção original, com a mesma altura na linha.
   Cada foto leva --r (largura/altura); a linha leva --n (quantas) e --soma (soma das proporções). Nada de px à mão. */
.cs-ref .cs-corpo{justify-content:flex-start;padding-top:var(--slide-goteira)}
.cs-fotos{flex:1;min-height:0;container-type:size;display:flex;gap:var(--slide-goteira);justify-content:center;align-items:flex-start}

.cs-fotos>.cs-foto{flex:none;aspect-ratio:var(--r);width:min(calc(100cqh * var(--r)),calc((100cqw - var(--slide-goteira) * (var(--n) - 1)) * var(--r) / var(--soma)))}
.cs-ref-lado{flex:1;min-height:0;display:grid;grid-template-columns:5fr 7fr;grid-template-rows:minmax(0,1fr);gap:var(--slide-goteira)}
.cs-ref-lado>.cs-fotos{height:100%}
.cs-ref .cs-topo .cs-chips{margin-top:var(--espaco-3,12px)}
.cs-loja.cs-ref .cs-titulo{font-size:64px;line-height:.95}
/* prévia: escala o palco para caber no cartão */
.cs-previa{position:relative;width:100%;overflow:hidden;background:#E5E5EA}
.cs-previa>.cs-palco{transform-origin:0 0;position:absolute;left:0;top:0}

/* ===== Sites: classes cw-* (tema claro). Chame Cabana.site.init() para o cabeçalho em vidro e a entrada das seções. ===== */

.cw-hero{display:grid;grid-template-columns:7fr 5fr;gap:var(--espaco-16);align-items:center;padding:var(--espaco-16) 0 var(--web-secao)}

 .cw-hero{grid-template-columns:1fr;gap:var(--espaco-8);padding:var(--espaco-8) 0 var(--web-secao-celular)}.cw-hero-titulo{font-size:3.5rem;line-height:3.5rem}.cw-titulo{font-size:2.75rem;line-height:2.875rem}.cw-sub{font-size:20px;line-height:28px}

.cd-section-body,.cd-section-body>*{min-width:0}
.cs-passo{display:flex;flex-direction:column;gap:20px}
.cs-chips{display:flex;gap:12px;flex-wrap:wrap}
.cs-loja .cs-cartao-titulo{font-size:40px;line-height:46px}
.cs-bloco-laranja .cs-numero{color:inherit;font-size:240px;line-height:220px}
.cs-bloco-laranja .cs-cartao-titulo{color:inherit}
.cs-g-meio{grid-template-columns:6fr 6fr;align-items:center}
.cw-campo{display:flex;flex-direction:column;gap:var(--espaco-2);max-width:480px}
.cw-campo label{font-size:15px;font-weight:600}
.cw-campo input,.cw-campo select,.cw-campo textarea{height:var(--ctl-grande);padding:0 var(--espaco-4);border-radius:var(--raio-controle);border:0;background:var(--controle);font:400 16px/1 var(--font-sans);color:var(--texto)}
.cw-campo textarea{height:auto;min-height:120px;padding:var(--espaco-3) var(--espaco-4);line-height:1.4}
.cw-campo input:focus-visible,.cw-campo select:focus-visible,.cw-campo textarea:focus-visible{outline:2px solid var(--foco);outline-offset:0}
.cw-campo-erro{font-size:14px;color:var(--erro)}
@media print{.cw-js .cw-entra{opacity:1;transform:none}}

/* ===== Marca nos slides (v1.4): assinatura, símbolo C e rodapé ===== */
/* rodapé: [logotipo] | título do deck · seção ............ classificação   página */
.cs-rodape img{height:var(--slide-logotipo-rodape);width:auto;display:block}
.cs-rodape-sep{width:1px;height:20px;background:var(--slide-linha);flex:none}
.cs-chapado .cs-rodape-sep{background:var(--linha-sobre-marca)}
.cs-rodape-titulo{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.cs-rodape-titulo b{font-weight:600;color:var(--slide-tinta)}
.cs-chapado .cs-rodape-titulo b{color:var(--sobre-marca)}
.cs-rodape-classe{margin-left:auto;letter-spacing:.08em;text-transform:uppercase;font-size:18px;font-weight:600}
.cs-rodape-pagina{margin-left:auto;min-width:32px;text-align:right;font-weight:600;color:var(--slide-tinta)}
.cs-rodape-classe+.cs-rodape-pagina{margin-left:24px}
.cs-chapado .cs-rodape-pagina{color:var(--sobre-marca)}
/* símbolo C no canto dos slides de conteúdo: inteiro, nunca cortado */
.cs-c-canto{position:absolute;top:var(--slide-c-canto-topo);right:var(--slide-margem-x);height:var(--slide-c-canto);width:auto;display:block;pointer-events:none}
/* símbolo C grande: sempre inteiro, dentro das margens (manual p.71 e p.192). Só capa, abertura e capa de loja */
.cs-c{position:absolute;width:auto;display:block;pointer-events:none;user-select:none}
.cs-c-capa{height:var(--slide-c-capa);right:var(--slide-margem-x);top:calc(46% - var(--slide-c-capa) / 2)}
.cs-capa-texto{max-width:880px}
.cs-c-abertura{height:var(--slide-c-abertura);right:var(--slide-margem-x);top:calc(50% - var(--slide-c-abertura) / 2)}
.cs-palco:has(.cs-c-abertura) .cs-centro{max-width:880px}
/* assinatura final */
.cs-assinatura{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--slide-espaco-m);padding-bottom:var(--slide-respiro-base)}
.cs-assinatura .cs-logotipo{height:var(--slide-logotipo-assinatura);width:auto;display:block}
.cs-assinatura p{margin:0;font-size:24px;line-height:32px;color:var(--slide-tinta-2)}
.cs-chapado .cs-assinatura p{color:var(--sobre-marca)}
.cs-logo-capa{height:var(--slide-logotipo-capa)}

.cs-c.cs-entra{animation-name:cs-fade}
/* Sites: símbolo C inteiro na faixa verde (versão negativa), dentro das margens */
.cw-c{display:block;height:280px;width:auto;justify-self:end}
@media (max-width:743px){.cw-c{height:160px;justify-self:start}}

/* Barra de abas flutuante (iOS 26): cápsula de vidro a 16 px das bordas */
.cb-abas-flutuante { height: 62px; margin: 0 var(--espaco-4) calc(var(--area-segura-base) + var(--espaco-2)); padding: 4px; border-radius: var(--raio-pilula); box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.6), 0 8px 32px rgba(0,0,0,0.12); }
[data-theme="escuro"] .cb-abas-flutuante { box-shadow: inset 0 0 0 0.5px rgba(255,255,255,0.12), 0 8px 32px rgba(0,0,0,0.5); }
.cb-abas-flutuante .cb-aba { border-radius: var(--raio-pilula); transition: background-color var(--dur-rapida) var(--curva-padrao); }
.cb-abas-flutuante .cb-aba[aria-selected="true"] { background: var(--aba-ativa); }
.cb-abas-flutuante .cb-aba:active { transform: scale(0.9); transition: transform var(--dur-micro) var(--curva-padrao); }
.cb-abas-flutuante .cb-aba-badge { box-shadow: none; }

/* 2.2 · fase 2: estados de campo, lateral e telas de erro */
.cb-campo input:disabled, .cb-campo-caixa:has(input:disabled) { background: var(--desabilitado); color: var(--texto-terciario); cursor: not-allowed; }
.cb-campo input[readonly] { background: none; box-shadow: inset 0 -0.5px 0 var(--separador); border-radius: 0; padding-left: 0; }
.cb-campo-caixa { display: flex; align-items: center; height: var(--ctl-medio); border-radius: var(--raio-controle); background: var(--controle); padding: 0 14px; gap: var(--espaco-2); }
.cb-campo-caixa:focus-within { box-shadow: inset 0 0 0 1.5px var(--foco); }
/* 4.15: contorno de 3:1 no repouso (WCAG 1.4.11); fundo cinza sozinho não basta */
.cb-campo > input:not([readonly]):not(:disabled):not(:focus), .cb-campo-caixa:not(:focus-within):not(:has(input:disabled)) { box-shadow: inset 0 0 0 1px var(--texto-terciario); }
.cb-campo.cb-campo-erro > input:not([readonly]):not(:disabled), .cb-campo.cb-campo-erro .cb-campo-caixa:not(:has(input:disabled)) { box-shadow: inset 0 0 0 1.5px var(--erro); }
.cb-campo-erro .cb-campo-caixa { box-shadow: inset 0 0 0 1.5px var(--erro); }
.cb-campo-caixa input { flex: 1; min-width: 0; height: 100%; padding: 0; background: none !important; box-shadow: none !important; }
.cb-campo-af { color: var(--texto-secundario); font-size: 1rem; flex: none; }
.cb-campo-pe { display: flex; justify-content: space-between; gap: var(--espaco-3); }
.cb-campo-cont { font-size: 0.8125rem; line-height: 1.125rem; color: var(--texto-secundario); font-variant-numeric: tabular-nums; margin-left: auto; }
.cb-campo-erro .cb-campo-msg::before { content: "! "; font-weight: 700; }

.cb-lateral-grupo { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--texto-secundario); margin: var(--espaco-6) var(--espaco-3) var(--espaco-2); }
.cb-lateral a { position: relative; }
@media (hover: hover) and (pointer: fine){.cb-lateral a:hover:not([aria-current]){ background: var(--controle); }}
.cb-lateral a .cb-icone { flex: none; color: var(--texto-secundario); }
.cb-lateral a[aria-current] .cb-icone { color: var(--acao-texto); }
.cb-lateral-rot { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cb-lateral-cont { font-size: 13px; font-weight: 500; color: var(--texto-secundario); font-variant-numeric: tabular-nums; }
.cb-lateral-cont.cb-atrasado { color: var(--erro); font-weight: 600; }
.cb-lateral-pe { margin-top: auto; display: flex; align-items: center; gap: var(--espaco-3); padding: var(--espaco-3); border-radius: var(--raio-controle); }
.cb-lateral-av { width: 32px; height: 32px; border-radius: var(--raio-pilula); background: var(--acao-tingido); color: var(--sobre-acao-tingido); font-weight: 700; display: grid; place-items: center; font-size: 13px; font-weight: 600; flex: none; }
.cb-lateral-pe b { display: block; font-size: 14px; line-height: 18px; }
.cb-lateral-pe span { font-size: 12px; line-height: 16px; color: var(--texto-secundario); }
.cb-lateral-recolher { all: unset; cursor: pointer; width: 40px; height: 40px; display: grid; place-items: center; border-radius: var(--raio-pilula); color: var(--texto-secundario); margin: 0 0 var(--espaco-4) var(--espaco-1); }
@media (hover: hover) and (pointer: fine){.cb-lateral-recolher:hover{ background: var(--controle); }}
.cb-lateral-trilho { width: 72px; padding-left: var(--espaco-2); padding-right: var(--espaco-2); }
.cb-lateral-trilho a { justify-content: center; padding: 0; }
.cb-lateral-trilho .cb-lateral-rot, .cb-lateral-trilho .cb-lateral-grupo, .cb-lateral-trilho .cb-lateral-nome, .cb-lateral-trilho img, .cb-lateral-trilho .cb-lateral-pe > div { display: none; }
.cb-lateral-trilho .cb-lateral-cont { position: absolute; top: 4px; right: 6px; font-size: 11px; }
.cb-lateral-trilho .cb-lateral-pe { justify-content: center; padding: var(--espaco-2) 0; }

.cb-erro-tela { display: flex; flex-direction: column; align-items: center; text-align: center; padding: var(--espaco-12) var(--espaco-6); gap: var(--espaco-2); max-width: 360px; margin: 0 auto; }
.cb-erro-compacto { flex-direction: row; text-align: left; align-items: flex-start; padding: var(--espaco-4); max-width: none; gap: var(--espaco-3); background: var(--superficie); border-radius: var(--raio-cartao); }
.cb-erro-icone { width: 64px; height: 64px; border-radius: var(--raio-pilula); background: var(--controle); color: var(--texto); display: grid; place-items: center; margin-bottom: var(--espaco-3); flex: none; }
.cb-erro-compacto .cb-erro-icone { width: 40px; height: 40px; margin: 0; }
.cb-erro-titulo { font-size: 1.375rem; line-height: 1.75rem; font-weight: 700; }
.cb-erro-compacto .cb-erro-titulo { font-size: 1.0625rem; line-height: 1.375rem; font-weight: 600; }
.cb-erro-txt { font-size: 0.9375rem; line-height: 1.25rem; color: var(--texto-secundario); }
.cb-erro-acoes { display: flex; flex-direction: column; align-items: stretch; gap: var(--espaco-2); width: 100%; margin-top: var(--espaco-4); }
.cb-erro-compacto .cb-erro-acoes { flex-direction: row; width: auto; margin-top: var(--espaco-3); }
.cb-erro-cod { font: 500 0.75rem/1rem var(--font-mono); color: var(--texto-secundario); margin-top: var(--espaco-3); }

/* 2.4 · fase 3: tela de referência nos três aparelhos */
.cb-tres { display: flex; flex-wrap: wrap; gap: var(--espaco-6); align-items: flex-end; padding-bottom: var(--espaco-2); }
.cb-tres-item { margin: 0; flex: none; }
.cb-tres-tela { position: relative; overflow: hidden; border-radius: var(--raio-cartao); box-shadow: 0 0 0 1px var(--separador), var(--sombra-1); background: var(--bg); }
.cb-tres-tela iframe { position: absolute; left: 0; top: 0; border: 0; transform-origin: 0 0; pointer-events: auto; }
.cb-tres-item figcaption { margin-top: var(--espaco-2); font-size: 0.8125rem; color: var(--texto-secundario); font-variant-numeric: tabular-nums; }
.cb-tres-item figcaption b { color: var(--texto); font-weight: 600; }

/* 2.5 · fase 4: calendário comparável e DRE */
.cd-sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
.cd-comp { display: flex; flex-direction: column; gap: var(--dado-space-3); font-family: var(--font-sans); color: var(--dado-ink); }
.cd-comp-datas { display: flex; align-items: flex-end; gap: var(--dado-space-4); flex-wrap: wrap; }
.cd-comp-bloco { display: flex; flex-direction: column; gap: 2px; }
.cd-comp-rot { font: 500 13px/18px var(--font-sans); color: var(--dado-ink-muted); }
.cd-comp-bloco b { font: 600 18px/24px var(--font-sans); font-feature-settings: "tnum" 1; }
.cd-comp-vs { font: 400 18px/24px var(--font-sans); color: var(--dado-ink-subtle); }
.cd-comp-nota { margin: 0; font: 400 13px/18px var(--font-sans); color: var(--dado-ink-muted); max-width: 52ch; }
.cd-comp-etq { display: flex; gap: var(--dado-space-2); flex-wrap: wrap; }
.cd-dre th[scope="row"] { text-align: left; font-weight: 400; white-space: nowrap; }
.cd-dre td, .cd-dre th { padding-top: 9px; padding-bottom: 9px; }
.cd-dre .cd-num { text-align: right; white-space: nowrap; }
.cd-dre-n0 th[scope="row"] { font-weight: 600; }
.cd-dre-n1 th[scope="row"] { padding-left: var(--dado-space-6); }
.cd-dre-n2 th[scope="row"] { padding-left: var(--dado-space-10); color: var(--dado-ink-muted); font-size: 13px; }
.cd-dre-n2 td { color: var(--dado-ink-muted); font-size: 13px; }
.cd-dre-res th[scope="row"], .cd-dre-res td { font-weight: 700; background: var(--dado-surface-sunken); box-shadow: inset 0 1px 0 var(--dado-border-strong); }
.cd-dre-novo { color: var(--dado-ink-muted); }
.cd-dre-nota { margin: var(--dado-space-3) 0 0; font: 400 12px/16px var(--font-sans); color: var(--dado-ink-muted); }
.cd-table.cd-dre tbody th { position: static; height: auto; background: none; border-bottom: 0; border-radius: 0; font: 400 14px/20px var(--font-sans); letter-spacing: 0; text-transform: none; color: var(--dado-ink); }
.cd-table.cd-dre td, .cd-table.cd-dre tbody th { border-bottom: 1px solid var(--dado-border); }
.cd-table.cd-dre .cd-dre-n0 th { font-weight: 600; }
.cd-table.cd-dre .cd-dre-n1 th { padding-left: var(--dado-space-6); }
.cd-table.cd-dre .cd-dre-n2 th { padding-left: var(--dado-space-10); color: var(--dado-ink-muted); font-size: 13px; }
.cd-table.cd-dre .cd-dre-res th, .cd-table.cd-dre .cd-dre-res td { font-weight: 700; background: var(--dado-surface-sunken); }
.cd-table.cd-dre thead th.cd-num { text-align: right; }

/* 2.6 · fase 5: operação e colaboração */
.cb-av { width: 28px; height: 28px; border-radius: var(--raio-pilula); background: var(--acao-tingido); color: var(--sobre-acao-tingido); display: inline-grid; place-items: center; font-size: 12px; font-weight: 600; flex: none; }
.cb-turno { background: var(--superficie); border-radius: var(--raio-cartao); padding: var(--espaco-4); display: flex; flex-direction: column; gap: var(--espaco-3); }
.cb-turno-pico { background: var(--marca-chapada); color: var(--sobre-marca); }
.cb-turno-topo { display: flex; align-items: center; justify-content: space-between; gap: var(--espaco-3); }
.cb-turno-nome { font-size: 1.25rem; line-height: 1.625rem; font-weight: 700; }
.cb-turno-hora { font-size: 0.9375rem; color: var(--texto-secundario); font-variant-numeric: tabular-nums; }
.cb-turno-pico .cb-turno-hora { color: var(--sobre-marca); }
.cb-turno-pico-rot { display: flex; align-items: center; gap: var(--espaco-2); font-size: 0.9375rem; font-weight: 600; }
.cb-turno-prog { font-size: 0.875rem; color: var(--texto-secundario); margin-top: var(--espaco-2); font-variant-numeric: tabular-nums; }
.cb-turno-aviso { font-size: 0.9375rem; line-height: 1.25rem; }
.cb-cm { background: var(--superficie); border-radius: var(--raio-cartao); padding: var(--espaco-4); display: flex; flex-direction: column; gap: var(--espaco-3); }
.cb-cm-topo { display: flex; gap: var(--espaco-3); align-items: flex-start; }
.cb-cm-foto { width: 56px; height: 56px; border-radius: var(--raio-sm); object-fit: cover; flex: none; }
.cb-cm-txt { flex: 1; min-width: 0; }
.cb-cm-eq { font-size: 1.0625rem; line-height: 1.375rem; font-weight: 600; }
.cb-cm-prob { font-size: 0.9375rem; line-height: 1.25rem; }
.cb-cm-meta { font-size: 0.8125rem; color: var(--texto-secundario); margin-top: 2px; }
.cb-cm-etapas { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; }
.cb-cm-etapas li { font-size: 0.8125rem; color: var(--texto-secundario); padding-top: 8px; box-shadow: inset 0 3px 0 var(--controle); }
.cb-cm-etapas li.cb-feita { box-shadow: inset 0 3px 0 var(--acao); }
.cb-cm-etapas li.cb-atual { box-shadow: inset 0 3px 0 var(--acao); color: var(--texto); font-weight: 600; }
.cb-cm-pe { display: flex; justify-content: space-between; align-items: center; font-size: 0.875rem; }
.cb-cm-pe > span:first-child { display: inline-flex; align-items: center; gap: var(--espaco-2); }
.cb-cm-prazo { color: var(--texto-secundario); font-variant-numeric: tabular-nums; }
.cb-plano { background: var(--superficie); border-radius: var(--raio-cartao); padding: var(--espaco-4); }
.cb-plano-num { display: flex; gap: var(--espaco-6); align-items: flex-start; padding-bottom: var(--espaco-4); box-shadow: inset 0 -0.5px 0 var(--separador); flex-wrap: wrap; }
.cb-plano-rot { font-size: 0.8125rem; font-weight: 600; color: var(--texto-secundario); }
.cb-plano-val { font-size: 1.75rem; line-height: 2rem; font-weight: 700; font-variant-numeric: tabular-nums; margin: 2px 0; }
.cb-plano-meta { font-size: 0.8125rem; color: var(--texto-secundario); }
.cb-plano-leitura { flex: 1; min-width: 220px; margin: 0; font-size: 0.9375rem; line-height: 1.375rem; }
.cb-plano-acoes { list-style: none; margin: 0; padding: 0; }
.cb-plano-acoes li { display: flex; align-items: center; gap: var(--espaco-3); padding: var(--espaco-3) 0; box-shadow: inset 0 -0.5px 0 var(--separador); }
.cb-plano-acoes li:last-child { box-shadow: none; padding-bottom: 0; }
.cb-plano-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.cb-plano-txt b { font-size: 0.9375rem; font-weight: 600; }
.cb-plano-txt span { font-size: 0.8125rem; color: var(--texto-secundario); }
.cb-selo-atencao .cb-selo-ponto { background: currentColor; }
.cb-turno-pico .cb-sw[aria-checked="true"] { background: var(--verde-limonada); }

/* 3.0 · alvo de toque de 44 nos controles pequenos de dado */
.cd-info::after { content: ""; position: absolute; inset: -16px; }
.cd-chip-x { position: relative; } .cd-chip-x::after { content: ""; position: absolute; inset: -12px; }
.cd-th-btn { position: relative; } .cd-th-btn::after { content: ""; position: absolute; inset: -15px; }
.cd-drawer-close::after { content: ""; position: absolute; inset: -8px; }
/* 3.0 · negrito no meio da frase é 600 (Tipografia › Pesos com papel); regra sem especificidade, qualquer classe vence */
:where(.cb, .cw, .cs-palco, .cd-root) :where(b, strong) { font-weight: 600; }

/* ===================== 3.1 · VIDRO, LUZ E NAVEGAÇÃO (iOS 26) ===================== */
/* Receita única do vidro regular: fundo ≥ 70% + desfoque 22 + saturação 1,8 + aro de luz + borda de 0,5 + sombra longa */
.cb-vidro, .cb-bi-vidro, .cb-bp, .cb-tab-busca, .cb-voltar {
  background-color: var(--vidro); -webkit-backdrop-filter: var(--vidro-desfoque); backdrop-filter: var(--vidro-desfoque);
  box-shadow: var(--vidro-aro), var(--vidro-borda), var(--vidro-sombra);
}
@media (prefers-reduced-transparency: reduce) {
  .cb-vidro, .cb-bi-vidro, .cb-bp, .cb-tab-busca, .cb-voltar, .cb-folha, .cb-alerta { background-color: var(--superficie) !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
  .cb-aviso, .cb-lote { background-color: #1C1C1E !important; -webkit-backdrop-filter: none !important; backdrop-filter: none !important; }
}
@media (prefers-contrast: more) { .cb-vidro, .cb-bp, .cb-tab-busca, .cb-voltar { background-color: var(--superficie); box-shadow: 0 0 0 1px var(--texto), var(--vidro-sombra); } }

/* Regra de luz: botões são vidro iluminado. Realce no topo, luz que segue o ponteiro, cresce no toque */
@property --cb-luz { syntax: '<number>'; inherits: false; initial-value: 0; }
.cb-btn, .cb-bi, .cb-bp-btn, .cb-voltar, .cb-tab-busca {
  --lx: 50%; --ly: 30%;
  background-image: radial-gradient(120% 140% at var(--lx) var(--ly), rgba(255,255,255,calc(var(--cb-luz) * .5)), transparent 60%);
  transition: --cb-luz 220ms var(--curva-padrao), background-color var(--dur-rapida) var(--curva-padrao), color var(--dur-rapida) var(--curva-padrao), transform var(--dur-mola-viva) var(--curva-mola-viva), box-shadow var(--dur-rapida) var(--curva-padrao);
}
.cb-btn-primario, .cb-bp-btn, .cb-bi-acao {
  background-image: radial-gradient(120% 140% at var(--lx) var(--ly), rgba(255,255,255,calc(var(--cb-luz) * .35)), transparent 60%), linear-gradient(180deg, rgba(255,255,255,.16), rgba(255,255,255,0) 55%);
  box-shadow: inset 0 1px 0 rgba(255,255,255,.30), inset 0 0 0 .5px rgba(255,255,255,.16), inset 0 -1px 0 rgba(0,40,8,.22), 0 1px 2px rgba(0,60,10,.22), 0 6px 16px -8px rgba(0,99,15,.55);
}
[data-theme="escuro"] .cb-btn-primario, [data-theme="escuro"] .cb-bp-btn, [data-theme="escuro"] .cb-bi-acao { box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 -1px 0 rgba(40,80,0,.2), 0 6px 18px -8px rgba(178,247,113,.4); }

.cb-pos-tela { position: relative; height: 680px; border-radius: 22px; overflow: hidden; background: var(--bg-agrupado); display: flex; flex-direction: column; }

.cb-pos-cab { padding: var(--espaco-3) var(--espaco-4) var(--espaco-2); display: flex; align-items: center; gap: var(--espaco-3); }
.cb-pos-cab h2 { margin: 0; font-size: 1.5rem; line-height: 1.875rem; font-weight: 700; letter-spacing: -0.01em; flex: 1; }
.cb-pos-corpo { flex: 1; overflow: auto; padding: 0 var(--espaco-4) var(--espaco-4); display: flex; flex-direction: column; gap: var(--espaco-3); }
.cb-pos-pe { padding: var(--espaco-3) var(--espaco-4) var(--espaco-4); display: flex; flex-direction: column; gap: var(--espaco-2); box-shadow: inset 0 0.5px 0 var(--separador); background: var(--superficie); }
/* Leitor de QR da maquininha */
.cb-leitor { position: relative; flex: 1; min-height: 0; background: #0b0b0c; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }
.cb-leitor-cam { position: absolute; inset: 0; }
.cb-leitor-cam img { width: 100%; height: 100%; object-fit: cover; opacity: .55; filter: blur(1px) saturate(.8); }
.cb-leitor-alvo { position: relative; width: 236px; height: 236px; margin-top: -40px; box-shadow: 0 0 0 999px rgba(0,0,0,.45); border-radius: 24px; }
.cb-leitor-alvo i { position: absolute; width: 40px; height: 40px; border: 4px solid var(--verde-limonada); }
.cb-leitor-alvo i:nth-child(1) { top: 0; left: 0; border-right: 0; border-bottom: 0; border-top-left-radius: 24px; }
.cb-leitor-alvo i:nth-child(2) { top: 0; right: 0; border-left: 0; border-bottom: 0; border-top-right-radius: 24px; }
.cb-leitor-alvo i:nth-child(3) { bottom: 0; left: 0; border-right: 0; border-top: 0; border-bottom-left-radius: 24px; }
.cb-leitor-alvo i:nth-child(4) { bottom: 0; right: 0; border-left: 0; border-top: 0; border-bottom-right-radius: 24px; }
.cb-leitor-erro .cb-leitor-alvo i { border-color: var(--laranja-burger, #FF5A26); }
.cb-leitor-linha { position: absolute; left: 16px; right: 16px; top: 50%; height: 2px; border-radius: 2px; background: var(--verde-limonada); box-shadow: 0 0 12px var(--verde-limonada); animation: cb-varre 1.8s ease-in-out infinite alternate; }
@keyframes cb-varre { from { transform: translateY(-96px); } to { transform: translateY(96px); } }
@media (prefers-reduced-motion: reduce) { .cb-leitor-linha { animation: none; } }
.cb-leitor-ok { position: absolute; inset: 0; display: grid; place-items: center; }
.cb-leitor-ok .cb-icone { width: 88px; height: 88px; padding: 20px; box-sizing: border-box; border-radius: 50%; background: var(--verde-limonada); color: var(--verde-cabana); animation: cb-pop var(--dur-base) var(--curva-pop) both; }
.cb-leitor-dica { position: relative; margin-top: var(--espaco-6); max-width: 260px; text-align: center; font-size: 1rem; line-height: 1.375rem; font-weight: 500; }
.cb-leitor-dica b { display: block; font-size: 1.125rem; margin-bottom: 4px; color: #FFB199; }
.cb-leitor-acoes { position: absolute; left: 16px; right: 16px; bottom: 16px; display: flex; gap: var(--espaco-3); align-items: center; }
.cb-leitor-btn { flex: 1; background: rgba(255,255,255,.16) !important; color: #fff !important; box-shadow: none !important; }
.cb-leitor-luz { width: 56px; height: 56px; border-radius: 50%; background: rgba(255,255,255,.16); color: #fff; }
/* Validação na maquininha */
.cb-valida { display: flex; flex-direction: column; gap: var(--espaco-3); }
.cb-valida-cliente { display: flex; align-items: center; gap: var(--espaco-3); background: var(--superficie); border-radius: var(--raio-cartao); padding: var(--espaco-3) var(--espaco-4); }
.cb-valida-av { width: 40px; height: 40px; font-size: 1rem; background: var(--verde-cabana); color: var(--verde-limonada); }
.cb-valida-nome { font-size: 1.0625rem; font-weight: 600; }
.cb-valida-sub { font-size: 0.8125rem; color: var(--texto-secundario); }
.cb-valida-ganha { display: flex; align-items: center; gap: 6px; justify-content: center; font-size: 0.875rem; font-weight: 600; color: var(--sucesso-texto); }
.cb-pos-tela:has(.cb-leitor) .cb-pos-topo { background: #0b0b0c; color: rgba(255,255,255,.6); padding-bottom: 6px; }

/* ===== 3.4 · PROMOÇÕES DO CLUBE: anúncio, peça com QR, página da promoção ===== */
/* Anúncio: medidas em cqw sobre a largura de 1080 (1cqw = 10,8 px na peça final). Margem 1/33 do lado maior. */
.cb-anuncio { position: relative; margin: 0; container-type: inline-size; overflow: hidden; border-radius: 0; background: var(--verde-cabana); color: var(--bege-maionese); font-family: var(--font-sans); --m: 3.8cqw; }
.cb-anuncio-feed { aspect-ratio: 4 / 5; }
.cb-anuncio-stories { aspect-ratio: 9 / 16; --m: 5.4cqw; }
.cb-anuncio-foto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cb-anuncio:not(.cb-anuncio-chapado)::after { content: ""; position: absolute; inset: 40% 0 0; background: linear-gradient(180deg, rgba(0,0,0,0), rgba(0,0,0,.62)); }
.cb-anuncio-txt { position: absolute; z-index: 1; left: var(--m); right: 22cqw; bottom: var(--m); display: flex; flex-direction: column; gap: 1.6cqw; }
.cb-anuncio-stories .cb-anuncio-txt { bottom: 22cqw; right: var(--m); } /* fora dos 340 px de baixo */
.cb-anuncio-titulo { font-weight: 700; text-transform: uppercase; font-size: 7.6cqw; line-height: .95; letter-spacing: -.01em; }
.cb-anuncio-stories .cb-anuncio-titulo { font-size: 9.6cqw; }
.cb-anuncio-fecho { display: block; font-family: var(--font-loja); font-weight: 700; font-synthesis: none; text-transform: none; color: var(--verde-limonada); font-size: 1.12em; letter-spacing: -.02em; line-height: 1; }
.cb-anuncio-cond { font-size: 2.6cqw; line-height: 1.3; font-weight: 500; opacity: .92; max-width: 70cqw; }
.cb-anuncio-stories .cb-anuncio-cond { font-size: 3.4cqw; max-width: none; }
.cb-anuncio-cta { align-self: flex-start; display: inline-flex; align-items: center; gap: 1.6cqw; margin-top: 2.4cqw; padding: 2.6cqw 4.4cqw; border-radius: 99px; background: #fff; color: #000; font-size: 4cqw; font-weight: 700; }
.cb-anuncio-cta .cb-icone { width: 4.6cqw; height: 4.6cqw; }
.cb-anuncio-selo { position: absolute; z-index: 1; left: var(--m); top: var(--m); padding: 1.4cqw 2.6cqw; border-radius: 1cqw; background: var(--verde-limonada); color: var(--verde-cabana); font-weight: 700; font-size: 3cqw; text-transform: uppercase; letter-spacing: .02em; }
.cb-anuncio-stories .cb-anuncio-selo { top: 26cqw; font-size: 3.8cqw; } /* fora dos 250 px de cima */
.cb-anuncio-logo { position: absolute; z-index: 1; right: var(--m); bottom: var(--m); height: 4.6cqw; width: auto; }
.cb-anuncio-stories .cb-anuncio-logo { bottom: 22cqw; height: 5.4cqw; top: auto; }
.cb-anuncio-stories .cb-anuncio-txt { right: 26cqw; }
.cb-anuncio-grande { position: absolute; right: var(--m); top: 6cqw; font-size: 46cqw; line-height: .8; font-weight: 700; color: var(--verde-limonada); letter-spacing: -.04em; }
.cb-anuncio-stories .cb-anuncio-grande { top: 30cqw; font-size: 64cqw; }
/* Peça impressa com QR (display de mesa 10 × 15 cm, cartaz, adesivo do saco) */
.cb-pecaqr { margin: 0; container-type: inline-size; }
.cb-pecaqr-in { position: relative; aspect-ratio: 2 / 3; background: var(--verde-cabana); color: var(--bege-maionese); display: flex; flex-direction: column; align-items: center; text-align: center; padding: 8cqw 7cqw; box-sizing: border-box; gap: 4cqw; font-family: var(--font-sans); }
.cb-pecaqr-quadrado .cb-pecaqr-in { aspect-ratio: 1; padding: 6cqw; gap: 3cqw; }
.cb-pecaqr-titulo { font-weight: 700; text-transform: uppercase; font-size: 9cqw; line-height: .95; }
.cb-pecaqr-fecho { display: block; font-family: var(--font-loja); font-weight: 700; font-synthesis: none; text-transform: none; color: var(--verde-limonada); font-size: 1.15em; letter-spacing: -.02em; }
.cb-pecaqr-qr { background: #fff; color: #000; border-radius: 5cqw; padding: 5cqw 5cqw 4cqw; width: 62cqw; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; gap: 1.6cqw; }
.cb-pecaqr-quadrado .cb-pecaqr-qr { width: 50cqw; }
.cb-pecaqr-aponte { font-weight: 700; font-size: 4.6cqw; }
.cb-pecaqr-link { font-size: 3.4cqw; color: #444; font-weight: 500; }
.cb-pecaqr-cond { font-size: 3.2cqw; line-height: 1.3; opacity: .9; }
.cb-pecaqr-logo { height: 6cqw; width: auto; margin-top: auto; }
/* Página da promoção */
.cb-promo { display: flex; flex-direction: column; gap: var(--espaco-4); }
.cb-promo-foto { position: relative; aspect-ratio: 4 / 3; border-radius: var(--raio-cartao); overflow: hidden; background: var(--superficie-2); }
.cb-promo-foto img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cb-promo-publico { position: absolute; left: 12px; top: 12px; padding: 5px 10px; border-radius: var(--raio-pilula); background: var(--vidro-forte); -webkit-backdrop-filter: var(--vidro-desfoque); backdrop-filter: var(--vidro-desfoque); font-size: 0.8125rem; font-weight: 600; color: var(--texto); }
.cb-promo-titulo { margin: 0; font-size: 1.75rem; line-height: 2.125rem; font-weight: 700; letter-spacing: -0.015em; }
.cb-promo-cond { margin: 6px 0 0; font-size: 0.9375rem; line-height: 1.375rem; color: var(--texto-secundario); }
.cb-promo-validade { margin: 8px 0 0; display: flex; align-items: center; gap: 6px; font-size: 0.875rem; font-weight: 600; color: var(--texto); }
/* Código de 6 números */
.cb-codigo { display: flex; flex-direction: column; gap: var(--espaco-2); }
.cb-codigo-rot { font-size: 0.8125rem; color: var(--texto-secundario); }
.cb-codigo-caixas { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; }
.cb-codigo-caixas span { height: 56px; border-radius: 12px; background: var(--controle); display: grid; place-items: center; font-size: 1.5rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.cb-codigo-caixas span.cb-atual { box-shadow: inset 0 0 0 2px var(--acao); background: var(--superficie); }
.cb-codigo-ajuda { font-size: 0.8125rem; line-height: 1.125rem; color: var(--texto-secundario); }
/* Prévia de mensagem (modelo do WhatsApp Business: cabeçalho, corpo, rodapé, até 2 botões) */
.cb-bolha-fundo { background: #EFEAE2; padding: var(--espaco-3); border-radius: var(--raio-cartao); }
.cb-bolha { max-width: 300px; background: #fff; border-radius: 6px 16px 16px 16px; overflow: hidden; box-shadow: 0 1px 1px rgba(0,0,0,.08); font-size: 0.9375rem; line-height: 1.3125rem; color: #111; }
.cb-bolha-img { display: block; width: 100%; aspect-ratio: 1200 / 628; object-fit: cover; }
.cb-bolha-corpo { padding: 8px 10px 4px; white-space: pre-line; }
.cb-bolha-hora { float: right; margin: 6px 0 0 8px; font-size: 0.6875rem; color: #5F6368; }
.cb-bolha-rodape { padding: 0 10px 8px; font-size: 0.8125rem; color: #5F6368; }
.cb-bolha-btn { border-top: 1px solid #eee; text-align: center; padding: 10px; color: #00668F; font-weight: 500; font-size: 0.9375rem; }
.cb-cupom-novo { display: inline-block; vertical-align: 2px; margin-right: 6px; padding: 1px 6px; border-radius: var(--raio-xs); background: var(--verde-limonada); color: var(--verde-cabana); font-size: 0.6875rem; font-weight: 700; }
.cb-bolha-tela { background: #EFEAE2; }

/* ===== 3.5 · PROMOÇÃO COM CARA DE MARCA ===== */
/* Topo imersivo da página da promoção: foto de marca de ponta a ponta, título de campanha (caixa alta + fecho em Cooper Nouveau, como o site de campanha). */
.cb-hero { position: relative; height: 410px; margin: 0; overflow: hidden; background: #111; color: var(--bege-maionese); }
.cb-hero-foto { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.cb-hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.38) 0%, rgba(0,0,0,0) 22%, rgba(0,0,0,0) 45%, rgba(0,0,0,.72) 100%); }
.cb-hero-topo { position: absolute; z-index: 1; left: 0; right: 0; top: var(--area-segura-topo); display: flex; align-items: center; justify-content: space-between; padding: 6px var(--espaco-4); }
.cb-hero-topo img { height: 26px; width: auto; }
.cb-hero-txt { position: absolute; z-index: 1; left: var(--espaco-5); right: var(--espaco-5); bottom: 50px; display: flex; flex-direction: column; align-items: flex-start; gap: 10px; }
.cb-hero-publico { padding: 5px 10px; border-radius: var(--raio-xs); background: var(--verde-limonada); color: var(--verde-cabana); font-size: 0.75rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.cb-hero-titulo { margin: 0; font-size: 2.375rem; line-height: 2.25rem; font-weight: 700; text-transform: uppercase; letter-spacing: -0.01em; }
.cb-hero-fecho { display: block; margin-top: 4px; font-family: var(--font-loja); font-weight: 700; font-synthesis: none; text-transform: none; color: var(--verde-limonada); font-size: 2.75rem; line-height: 2.75rem; letter-spacing: -0.02em; }
/* Fatos da promoção: cartão que sobe sobre a foto */
.cb-fatos { position: relative; z-index: 2; background: var(--superficie); border-radius: 24px; padding: var(--espaco-4); display: flex; flex-direction: column; gap: var(--espaco-4); box-shadow: 0 1px 2px rgba(0,0,0,.06), 0 12px 32px -16px rgba(0,0,0,.25); }
.cb-fatos-sobre { margin: -36px var(--espaco-4) 0; }
.cb-fatos-benef { display: flex; gap: var(--espaco-3); align-items: center; }
.cb-fatos-benef > div { display: flex; flex-direction: column; }
.cb-fatos-benef b { font-size: 1.125rem; line-height: 1.375rem; font-weight: 700; }
.cb-fatos-benef span { font-size: 0.875rem; color: var(--texto-secundario); }
.cb-fatos-ic { width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: var(--verde-cabana); color: var(--verde-limonada); flex: none; }
.cb-fatos-grade { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.cb-fatos-grade div { display: flex; gap: 8px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--bg-agrupado); font-size: 0.8125rem; line-height: 1.125rem; font-weight: 500; }
.cb-fatos-grade div.cb-on { background: var(--acao-tingido); color: var(--sobre-acao-tingido); font-weight: 600; }
.cb-fatos-grade .cb-icone { flex: none; }
/* Como funciona: passos numerados ligados por uma linha */
.cb-como-tit { margin: 0 0 var(--espaco-3); font-size: 1.25rem; line-height: 1.625rem; font-weight: 700; }
.cb-como ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; }
.cb-como li { position: relative; display: flex; gap: var(--espaco-3); padding-bottom: var(--espaco-4); }
.cb-como li:last-child { padding-bottom: 0; }
.cb-como li:not(:last-child)::before { content: ""; position: absolute; left: 15px; top: 34px; bottom: 2px; width: 2px; border-radius: 2px; background: var(--acao-tingido); }
.cb-como-n { width: 32px; height: 32px; border-radius: 50%; flex: none; display: grid; place-items: center; background: var(--verde-cabana); color: var(--verde-limonada); font-weight: 700; font-size: 0.9375rem; }
.cb-como li > div { display: flex; flex-direction: column; padding-top: 5px; }
.cb-como b { font-size: 1rem; line-height: 1.375rem; font-weight: 600; }
.cb-como li span:not(.cb-como-n) { font-size: 0.875rem; line-height: 1.25rem; color: var(--texto-secundario); }
/* Conquista: topo verde chapado da tela de cupom guardado */
/* O que está sendo guardado (topo das telas de entrada) */
.cb-guardando { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 16px; background: var(--superficie); box-shadow: inset 0 0 0 1px var(--separador); }
.cb-guardando > div { flex: 1; display: flex; flex-direction: column; }
.cb-guardando > div span { font-size: 0.75rem; color: var(--texto-secundario); }
.cb-guardando b { font-size: 0.9375rem; font-weight: 600; }
.cb-guardando em { font-style: normal; font-size: 0.75rem; font-weight: 600; color: var(--texto-secundario); }
/* Luva branca: o cupom sobre verde chapado ganha uma borda de papel para o canhoto verde não sumir no fundo */
.cb-luva { background: var(--superficie); border-radius: 24px; padding: 4px; box-shadow: 0 1px 2px rgba(0,0,0,.08), 0 14px 32px -16px rgba(0,0,0,.35); }
.cb-luva .cb-cupom { border-radius: 20px; }

/* ===== 3.6 · MAIS FUNÇÕES DO CLUBE ===== */
/* Atalhos da home do Clube: grade 2 × 2 */
/* Extrato */
.cb-extrato { display: flex; flex-direction: column; gap: var(--espaco-5); }
.cb-extrato-vence { display: flex; gap: 12px; align-items: flex-start; padding: 14px 16px; border-radius: var(--raio-cartao); background: var(--atencao-suave); color: var(--atencao-texto); }
.cb-extrato-vence > div { display: flex; flex-direction: column; gap: 2px; }
.cb-extrato-vence b { font-size: 0.9375rem; }
.cb-extrato-vence span { font-size: 0.8125rem; line-height: 1.125rem; color: var(--texto); opacity: .8; }
.cb-extrato-cab { display: flex; justify-content: space-between; padding: 0 var(--espaco-4) 8px; font-size: 0.8125rem; font-weight: 600; color: var(--texto-secundario); }
.cb-extrato-ic { width: 32px; height: 32px; border-radius: 10px; display: grid; place-items: center; flex: none; background: var(--controle); color: var(--texto-secundario); }
.cb-x-ganhou .cb-extrato-ic, .cb-x-bonus .cb-extrato-ic { background: var(--acao-tingido); color: var(--sobre-acao-tingido); }
.cb-x-ganhou .cb-item-valor, .cb-x-bonus .cb-item-valor { color: var(--sucesso-texto); font-weight: 600; }
.cb-x-venceu .cb-extrato-ic { background: var(--atencao-suave); color: var(--atencao-texto); }
.cb-x-venceu .cb-item-valor { color: var(--texto-secundario); text-decoration: line-through; }
/* Presente de aniversário */
.cb-presente { display: flex; flex-direction: column; gap: 10px; }
.cb-presente-op { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; cursor: pointer; text-align: left; font: inherit; color: var(--texto); padding: 10px 14px 10px 10px; border-radius: 12px; background: var(--superficie); box-shadow: none; transition: box-shadow var(--dur-rapida) var(--curva-padrao); }
.cb-presente-op.cb-on { box-shadow: inset 0 0 0 2px var(--acao); }
.cb-presente-foto { width: 64px; height: 64px; border-radius: 12px; overflow: hidden; flex: none; background: var(--superficie-2); display: grid; place-items: center; color: var(--verde-cabana); }
.cb-presente-foto img { width: 100%; height: 100%; object-fit: cover; }
.cb-presente-txt { flex: 1; display: flex; flex-direction: column; }
.cb-presente-txt b { font-size: 1rem; font-weight: 600; }
.cb-presente-txt span { font-size: 0.8125rem; color: var(--texto-secundario); }
.cb-presente-op.cb-on .cb-op-marca { background: var(--acao); box-shadow: none; }
/* Indique e ganhe */
.cb-indique { display: flex; flex-direction: column; gap: var(--espaco-4); }
.cb-indique-topo { background: var(--verde-cabana); color: var(--bege-maionese); border-radius: var(--raio-cartao); padding: var(--espaco-5) var(--espaco-4) var(--espaco-4); display: flex; flex-direction: column; gap: var(--espaco-4); }
.cb-indique-trocas { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; text-align: center; }
.cb-indique-trocas div { display: flex; flex-direction: column; gap: 2px; }
.cb-indique-trocas span { font-size: 0.8125rem; opacity: .85; }
.cb-indique-trocas b { font-size: 1.75rem; line-height: 2rem; font-weight: 700; color: var(--verde-limonada); font-variant-numeric: tabular-nums; }
.cb-indique-trocas i { font-style: normal; font-size: 1.5rem; opacity: .6; }
.cb-indique-link { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 6px 6px 14px; border-radius: var(--raio-pilula); background: rgba(255,255,255,.12); }
.cb-indique-link > span { font-weight: 600; font-size: 0.9375rem; }
.cb-indique-link .cb-btn-primario { background: var(--verde-limonada); color: var(--verde-cabana); }
.cb-indique-regra { margin: 0; font-size: 0.8125rem; line-height: 1.125rem; opacity: .85; }
.cb-indique-et { display: flex; gap: 4px; margin-top: 4px; }

.f-link:focus-visible { outline: 2px solid var(--dado-focus-ring); outline-offset: 2px; border-radius: var(--dado-radius-xs); }
.store-opt { display: flex; align-items: center; gap: var(--dado-space-2); padding: var(--dado-space-2); border-radius: var(--dado-radius-xs); cursor: pointer; font: 400 14px/20px var(--font-sans); color: var(--dado-ink); }
.store-opt input { width: 16px; height: 16px; margin: 0; accent-color: var(--dado-brand); flex: none; }
@media (hover: hover) and (pointer: fine) { .store-opt:hover { background: var(--dado-surface-sunken); } }

/* Seções e grades */
.cd-section { margin-top: var(--dado-space-10); }
.stack > * + * { margin-top: var(--dado-space-6); }
.kpi-grid { display: grid; gap: var(--dado-space-4); grid-template-columns: repeat(4, minmax(0, 1fr)); }
.kpi-grid-5 { grid-template-columns: repeat(5, minmax(0, 1fr)); }
.grid-2 { display: grid; gap: var(--dado-space-6); grid-template-columns: repeat(2, minmax(0, 1fr)); align-items: stretch; }
.grid-84 { display: grid; gap: var(--dado-space-6); grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); align-items: stretch; }
.cd-section-body, .cd-panel, .cd-panel-body { min-width: 0; }
.chart-box { position: relative; height: var(--dado-chart-h-lg); }
.kpi-grid .cd-kpi-value.is-text { font-size: inherit; }
.cd-kpi-foot { min-height: 24px; flex-wrap: wrap; }
.kpi-btn { margin-top: var(--dado-space-2); }
.panel-legend { display: flex; flex-wrap: wrap; gap: var(--dado-space-2); margin-bottom: var(--dado-space-3); }
.panel-tools { display: flex; flex-wrap: wrap; gap: var(--dado-space-2); align-items: center; }
.cd-panel-actions { flex-wrap: wrap; justify-content: flex-end; }
.nota { font: 400 13px/18px var(--font-sans); color: var(--dado-ink-muted); margin: var(--dado-space-3) 0 0; }
.vazio { font: 400 14px/20px var(--font-sans); color: var(--dado-ink-muted); padding: var(--dado-space-6) 0; }

/* Tabelas (cd-table do kit + ajustes de cabeçalho em dois níveis) */
.cd-table th { text-transform: none; letter-spacing: 0; }
.cd-table th.grp { text-align: center; }
.cd-table th.sub, .cd-table th.is-num { text-align: right; }
.cd-table td.loja { font-weight: 500; text-align: left; }
.cd-table tr.total-row td { font-weight: 600; background: var(--dado-surface-sunken); border-bottom: 0; }
.cd-table .real-ok { color: var(--dado-positive); font-weight: 500; }
.cd-table .real-bad { color: var(--dado-negative); font-weight: 500; }
.hc-table td, .hc-table th, .mgr-table td, .mgr-table th { white-space: nowrap; }
.cd-delta-plain { white-space: nowrap; }

/* Mapa de calor do Diagnóstico: escala divergente do kit, número sempre escrito na célula */
.heatmap-table td.hm { text-align: center; font-weight: 500; min-width: 56px; }
.hm-100, .cd-table td.hm-100 { background: var(--dado-div-pos-3); color: var(--dado-ink-inverse); }
.hm-90, .cd-table td.hm-90 { background: var(--dado-div-pos-1); color: var(--dado-ink); }
.hm-75, .cd-table td.hm-75 { background: var(--dado-div-neg-1); color: var(--dado-ink); }
.hm-low, .cd-table td.hm-low { background: var(--dado-div-neg-3); color: var(--dado-ink-inverse); }
.hm-na, .cd-table td.hm-na { background: var(--dado-surface-sunken); color: var(--dado-ink-subtle); }
.hm-legend { display: flex; flex-wrap: wrap; gap: var(--dado-space-4); margin-top: var(--dado-space-3); font: 400 13px/18px var(--font-sans); color: var(--dado-ink-muted); }
.hm-legend span { display: inline-flex; align-items: center; gap: var(--dado-space-2); }
.hm-sw { width: 14px; height: 14px; border-radius: var(--dado-radius-xs); box-shadow: 0 0 0 1px var(--dado-border); }

/* Cabeçalho temporário das exportações em imagem */
.export-header { display: none; padding: var(--dado-space-4) var(--dado-space-5); background: var(--dado-brand); color: var(--dado-ink-inverse); border-radius: var(--dado-radius-md); margin-bottom: var(--dado-space-4); }
.export-header.show { display: block; }
.export-header .t1 { font: 600 18px/24px var(--font-sans); margin: 0; }
.export-header .t2 { font: 400 13px/18px var(--font-sans); margin: var(--dado-space-1) 0 0; }

/* Gaveta de ajuste de admissões e demissões (DetailDrawer do kit) */
.adj-toolbar { display: flex; justify-content: space-between; align-items: center; gap: var(--dado-space-3); flex-wrap: wrap; margin-bottom: var(--dado-space-3); }
.adj-toolbar .acoes { display: flex; gap: var(--dado-space-4); }
.adj-count { font: 400 13px/18px var(--font-sans); color: var(--dado-ink-muted); }
.adj-list { display: flex; flex-direction: column; }
.adj-item { display: flex; gap: var(--dado-space-3); align-items: flex-start; padding: var(--dado-space-3) 0; border-bottom: 1px solid var(--dado-border); cursor: pointer; }
.adj-item input { width: 16px; height: 16px; margin: 2px 0 0; accent-color: var(--dado-brand); flex: none; }
.adj-item .nome { font: 500 14px/20px var(--font-sans); color: var(--dado-ink); }
.adj-item .det { font: 400 13px/18px var(--font-sans); color: var(--dado-ink-muted); }
.adj-item.excluded .nome { color: var(--dado-ink-subtle); text-decoration: line-through; }
.adj-foot { margin-top: var(--dado-space-4); display: flex; justify-content: flex-end; }

@media (pointer: coarse) { .f-control, .f-btn { min-height: 44px; } .store-opt { min-height: 44px; } }
@media (max-width: 1100px) { .kpi-grid-5 { grid-template-columns: repeat(3, minmax(0, 1fr)); } .kpi-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 900px) {
  .cd-root { padding: 0 var(--dado-space-4) var(--dado-space-10); }
  .grid-2, .grid-84 { grid-template-columns: 1fr; }
  .kpi-grid, .kpi-grid-5 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 520px) { .kpi-grid, .kpi-grid-5 { grid-template-columns: 1fr; } .f-block, .f-control { width: 100%; } }

/* Rankings em barras: rótulo mais largo para nomes de loja e de cargo */
.cd-bars .cd-bar-row { grid-template-columns: minmax(140px, 44%) 1fr auto auto; }

/* Contorno de cartão é anel de sombra, não border (Forma e materiais) */
.cd-kpi { border: 0; box-shadow: 0 0 0 1px var(--dado-border); }

.cd-kpi-value.is-pos { color: var(--dado-positive); }
.cd-kpi-value.is-warn { color: var(--dado-warning); }
.cd-kpi-value.is-neg { color: var(--dado-negative); }
.stack-top { margin-top: var(--dado-space-6); }
.aviso-base .cd-badge { white-space: normal; }

            c.classList.add('is-leaving');
            setTimeout(function () { items = items.filter(function (y) { return y !== it; }); render(); if (o.onChange) o.onChange(items); }, reduced() ? 0 : ms('duration-fast', 140));

        : it.tone === 'positive' ? '<svg viewBox="0 0 16 16"><path d="M4 11l8-6m0 0v4.5M12 5H7.5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>'
        : '<svg viewBox="0 0 16 16"><circle cx="8" cy="8" r="2.5" fill="currentColor"/></svg>';

      b.appendChild(h('div', 'cd-ilist-title', it.title));

  /* ---------------- DetailDrawer (clicar no dado abre o detalhe) ---------------- */

  /* ---------------- Calendário comparável ---------------- */
  var DIAS = ['dom', 'seg', 'ter', 'qua', 'qui', 'sex', 'sáb'];
  function paraData(d) { if (d instanceof Date) return new Date(d.getFullYear(), d.getMonth(), d.getDate()); var p = String(d).split('-'); return new Date(+p[0], +p[1] - 1, +p[2]); }
  function dataCurta(d) { return DIAS[d.getDay()] + ' ' + String(d.getDate()).padStart(2, '0') + '/' + String(d.getMonth() + 1).padStart(2, '0') + '/' + d.getFullYear(); }
  var calendario = {
    comparar: function (data, modo, evento) {

      if (modo === 'data') { var y = new Date(d.getFullYear() - 1, d.getMonth(), d.getDate()); if (y.getMonth() !== d.getMonth()) y = new Date(d.getFullYear() - 1, d.getMonth() + 1, 0); return y; }

    },
    curta: dataCurta,
    MODOS: { 'dia-da-semana': 'Mesmo dia da semana', data: 'Mesma data', evento: 'Mesmo evento' }

  function ComparacaoPeriodo(el, o) {

      a.appendChild(b1); a.appendChild(vs); a.appendChild(b2);

      var ops = [{ value: 'dia-da-semana', label: 'Dia da semana' }, { value: 'data', label: 'Data' }];

      SegmentedControl(segEl, { options: ops, value: modo, size: 'sm', label: 'Como comparar', onChange: function (v) { modo = v; render(); if (o.onChange) o.onChange(v, calendario.comparar(o.data, v, o.evento)); } });
      var nota = h('p', 'cd-comp-nota', modo === 'dia-da-semana' ? 'Sábado contra sábado, 364 dias atrás. O padrão para venda e movimento.' : modo === 'data' ? 'Mesma data do ano anterior. Só para datas fixas: Natal, Réveillon, Dia dos Namorados.' : 'Feriado móvel contra o mesmo feriado do ano anterior, mesmo em semanas diferentes.');

  }

  /* ---------------- DRE ---------------- */
  function DRE(el, o) {
    o = o || {};
    var base = o.receita || (o.linhas || []).filter(function (l) { return l.base; }).map(function (l) { return l.valor; })[0] || 0;
    var fv = function (v) { return v == null ? '—' : (v < 0 ? '−' : '') + fmt.num(Math.abs(v)); };
    var cols = o.colunas || ['realizado', 'av', 'orcado', 'desvio', 'anterior', 'ah'];
    var nomes = { realizado: 'Realizado', av: '% receita', orcado: 'Orçado', desvio: 'vs. orçado', anterior: o.rotuloAnterior || 'Ano anterior', ah: 'vs. ano ant.' };
    clear(el);
    var wrap = h('div', 'cd-table-wrap');
    var t = h('table', 'cd-table cd-dre');
    var cap = h('caption', 'cd-sr', o.titulo || 'Demonstração de resultado'); t.appendChild(cap);
    var th = h('thead'), tr = h('tr');
    var c0 = h('th', null, o.unidade || 'R$'); c0.setAttribute('scope', 'col'); tr.appendChild(c0);
    cols.forEach(function (c) { var x = h('th', 'cd-num', nomes[c]); x.setAttribute('scope', 'col'); tr.appendChild(x); });
    th.appendChild(tr); t.appendChild(th);
    var tb = h('tbody');
    (o.linhas || []).forEach(function (l) {
      var r = h('tr', 'cd-dre-n' + (l.nivel || 0) + (l.tipo === 'resultado' ? ' cd-dre-res' : ''));
      var c = h('th', null, l.rotulo); c.setAttribute('scope', 'row'); r.appendChild(c);
      var custo = l.tipo === 'custo' || l.tipo === 'despesa' || l.tipo === 'deducao';

        else if (k === 'av') td.textContent = base ? fmt.pct(Math.abs(l.valor) / base * 100) : '—';
        else if (k === 'desvio') { if (l.orcado != null && l.orcado !== 0) td.appendChild(Delta((Math.abs(l.valor) - Math.abs(l.orcado)) / Math.abs(l.orcado) * 100, { invert: custo })); else td.textContent = '—'; }
        else if (k === 'ah') { if (l.anterior) td.appendChild(Delta((Math.abs(l.valor) - Math.abs(l.anterior)) / Math.abs(l.anterior) * 100, { invert: custo })); else td.appendChild(h('span', 'cd-dre-novo', l.anterior === 0 ? '(novo)' : '—')); }
        r.appendChild(td);

      tb.appendChild(r);

})();

;
/* ===== Sites: window.Cabana.site.init() — cabeçalho em vidro ao rolar e entrada das seções ao aparecer ===== */
(function () {
  var C = window.Cabana = window.Cabana || {};
  C.site = {
    init: function (root) {
      var doc = document, r = root || doc;
      doc.documentElement.classList.add('cw-js');
      var cab = r.querySelector('.cw-cabecalho');
      if (cab) { var f = function () { cab.classList.toggle('cw-rolou', (window.scrollY || 0) > 8); }; window.addEventListener('scroll', f, { passive: true }); f(); }
      var els = r.querySelectorAll('.cw-entra');
      var reduz = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
      if (reduz || !window.IntersectionObserver) { els.forEach(function (e) { e.classList.add('cw-visivel'); }); return; }
      var io = new IntersectionObserver(function (ents) { ents.forEach(function (en) { if (en.isIntersecting) { en.target.classList.add('cw-visivel'); io.unobserve(en.target); } }); }, { threshold: 0.15 });
      els.forEach(function (e) { io.observe(e); });
    }
  };
})();
